[package]
name = "ubm-mobile"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../../LICENSE-UBM-SOURCE-AVAILABLE-1.0.md"
description = "Process-owned mobile Rust owner for UBM 5.0: DesktopCentral over the platform radio (Android GATT / CoreBluetooth) with per-session leases and the ubm-mobile-wire/3 op table"
repository = "https://github.com/sfourdrinier/unified-ble-manager"

[features]
synthetic-marker-harness = []
# Test-only hooks for exercising host-owned recovery paths that a platform
# callback cannot reliably force on demand.
test-support = []

[dependencies]
ubm-core = { path = "../ubm-core" }
# The shared central without btleplug: the platform radio arrives through
# `ForeignRadio`, never through a desktop radio framework.
ubm-desktop = { path = "../ubm-desktop", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
getrandom = "0.4.3"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }

[[test]]
name = "scan_terminal_evidence_debt"
required-features = ["test-support"]

[[test]]
name = "subscription_terminal_evidence_debt"
required-features = ["test-support"]
