[package]
name = "ubm5_jni_echo"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "UBM 5.0 FFI feasibility: JNI echo for Android/JVM hosts (trackourhealth/bun-mono#1188, FFI-NATIVE card). Echo-only stand-in; NOT BLE functionality."
publish = false
license-file = "../../LICENSE-UBM-SOURCE-AVAILABLE-1.0.md"
repository = "https://github.com/sfourdrinier/unified-ble-manager"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
synthetic-marker-harness = ["ubm-mobile/synthetic-marker-harness"]
jni-roundtrip = ["ubm-desktop/reclaim-test-support", "ubm-mobile/test-support"]

[dependencies]
jni = "=0.22.4"
serde_json = "1"
ubm-core = { path = "../../crates/ubm-core" }
ubm-fake-radio = { path = "../../crates/ubm-fake-radio" }
# Production mobile owner (`com.ubm.core.MobileCoreBridge`): no fake radio,
# no btleplug.
ubm-mobile = { path = "../../crates/ubm-mobile" }
ubm-desktop = { path = "../../crates/ubm-desktop", default-features = false }
