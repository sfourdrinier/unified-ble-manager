[package]
name = "ubm5_napi_echo"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "UBM 5.0 N-API binding: FFI echo round-trip (trackourhealth/bun-mono#1188, FFI-NAPI card) plus the F01 UbmCentral dispatch over ubm-desktop (real BLE operations in Rust)."
publish = false
license-file = "../../LICENSE-UBM-SOURCE-AVAILABLE-1.0.md"
repository = "https://github.com/sfourdrinier/unified-ble-manager"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
reclaim-test-support = ["ubm-desktop/reclaim-test-support"]

[dependencies]
napi = { version = "=2.16.17", features = ["napi4", "tokio_rt"] }
napi-derive = "=2.16.13"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
ubm-core = { path = "../../crates/ubm-core" }
ubm-desktop = { path = "../../crates/ubm-desktop" }
ubm-fake-radio = { path = "../../crates/ubm-fake-radio" }
# The N-API dispatch boundary constructs the desktop radio's explicitly
# typed failure-evidence store. Keep the direct dependency aligned with the
# workspace-patched production btleplug crate; a local duplicate would make
# the trait object incompatible with `ubm-desktop`.
btleplug = { version = "0.12" }

[build-dependencies]
napi-build = "=2.4.2"
