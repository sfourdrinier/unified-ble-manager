[package]
name = "ubm5_napi_echo"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
description = "UBM 5.0 FFI feasibility: N-API echo round-trip (trackourhealth/bun-mono#1188, FFI-NAPI card). Echo-only stand-in; NOT BLE functionality."
publish = false
license-file = "../../LICENSE-UBM-SOURCE-AVAILABLE-1.0.md"
repository = "https://github.com/sfourdrinier/unified-ble-manager"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "=2.16.17", features = ["napi4"] }
napi-derive = "=2.16.13"
ubm-core = { path = "../../crates/ubm-core" }
ubm-fake-radio = { path = "../../crates/ubm-fake-radio" }

[build-dependencies]
napi-build = "=2.4.2"
