name: 🧩 Project setup / integration help
description: Ask for help getting Unified BLE Manager integrated into a concrete host project.
title: "🧩 "
labels: [question]
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I read the README, migration guide, and documentation for my selected host.
          required: true
        - label: I selected an explicit host entrypoint rather than expecting the neutral root to choose a radio.
          required: true

  - type: input
    id: version
    attributes:
      label: unified-ble-manager version
      placeholder: "4.0.0"
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Integration target
      options:
        - React Native Android
        - React Native Apple
        - Expo / CNG
        - Browser Web Bluetooth
        - Electron macOS / CoreBluetooth
        - Electron Windows / WinRT
        - Node macOS / CoreBluetooth
        - Node Windows / WinRT
        - Node Linux / BlueZ
        - Custom backend SDK
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Project environment
      description: Include package manager, OS, architecture, runtime/framework versions, and relevant native toolchain versions.
      placeholder: |
        Package manager: pnpm 10.x
        OS/arch: Ubuntu 26.x x64
        Runtime/framework: Node 24.x / Electron 43.x / RN 0.86.x / Expo 57.x
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Current setup
      description: Show the package install, import/entrypoint, manager/provider construction, and any Expo/native configuration involved.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Where does setup fail?
      description: Include the exact command/error and whether the failure occurs at install, build, load, permission, adapter, scan, connection, or GATT time.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant redacted logs and package resolution output. Do not include credentials or sensitive BLE/user data.
      render: shell
