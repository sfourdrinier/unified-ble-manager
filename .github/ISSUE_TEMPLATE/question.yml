name: ❓ Usage question
description: Ask a focused public question about integrating Unified BLE Manager.
title: "❓ "
labels: [question]
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched the README, host documentation, and existing issues.
          required: true
        - label: This question does not contain private vulnerability details.
          required: true

  - type: input
    id: version
    attributes:
      label: unified-ble-manager version
      placeholder: "4.0.0"
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Host / entrypoint
      description: For example React Native Android, Web Bluetooth, Electron renderer, Node/BlueZ, or backend-sdk.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Describe the desired BLE flow and relevant ownership/lifecycle context.
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include a small code example and any typed error/capability information that helps answer the question.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS/runtime/framework/browser/adapter details when the question is host-specific.
