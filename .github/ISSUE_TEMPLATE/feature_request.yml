name: ✨ Feature request
description: Propose a focused addition to Unified BLE Manager.
title: "✨ "
labels: [enhancement]
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues and the 4.x roadmap/documentation.
          required: true
        - label: I can describe the user/host problem independently of a particular implementation.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What concrete BLE integration problem is currently difficult or impossible?
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Primary scope
      options:
        - Host-neutral public API
        - React Native Android
        - React Native Apple
        - Web Bluetooth
        - Electron
        - Node / CoreBluetooth
        - Node / WinRT
        - Node / BlueZ
        - Backend SDK / third-party backend
        - Testing / TCK / diagnostics
        - Profiles / codecs / CLI
        - Documentation / tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: desired-contract
    attributes:
      label: Desired behavior / contract
      description: Describe the observable behavior, including ownership, cancellation, errors, capabilities, and lifecycle when relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround / alternatives
      description: What can consumers do today, and why is it insufficient?

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and backend implications
      description: Note whether this changes a public export, backend contract, native protocol, host capability, security boundary, or support claim.

  - type: textarea
    id: implementation
    attributes:
      label: Suggested implementation
      description: Optional technical proposal, references, or willingness to contribute.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement or validate this feature.
