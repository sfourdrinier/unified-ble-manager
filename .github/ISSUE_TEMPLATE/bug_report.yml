name: 🐛 Bug report
description: Report a reproducible Unified BLE Manager defect or regression.
title: "🐛 "
labels: [bug]
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues and the current documentation.
          required: true
        - label: This is a reproducible defect, not a private security report.
          required: true

  - type: input
    id: package-version
    attributes:
      label: unified-ble-manager version
      description: Use the exact installed version (for example, 4.0.0).
      placeholder: "4.0.0"
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Host / public entrypoint
      options:
        - React Native Android
        - React Native Apple
        - Web Bluetooth
        - Electron main / CoreBluetooth
        - Electron main / WinRT
        - Electron renderer IPC
        - Node / CoreBluetooth
        - Node / WinRT
        - Node / BlueZ
        - Backend SDK / custom backend
        - Testing / deterministic backend
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS/version and relevant Node, Electron, React Native, Expo, browser, architecture, adapter, and peripheral information.
      placeholder: |
        OS: macOS 26.x
        Runtime: Node 24.x / Electron 43.x / RN 0.86.x / browser version
        Architecture: arm64
        BLE adapter/peripheral: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the typed error/terminal/capability state when available.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest runnable code/repository and exact steps needed to reproduce the issue.
      value: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: installed-package
    attributes:
      label: Installed package resolution
      description: Paste the relevant output from `pnpm why unified-ble-manager`, `npm ls unified-ble-manager`, or equivalent.
      render: shell

  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics / logs
      description: Redact credentials, real user/patient data, stable BLE identifiers, and payloads that are not necessary to reproduce the defect.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Include whether this reproduces on real hardware, simulator/mock only, or multiple host/backend combinations.
