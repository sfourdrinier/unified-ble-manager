name: Select SDK-compatible Xcode
description: Select stable Xcode 26.4+ for SDK 57 or Xcode 27 for SDK 58.
inputs:
  xcode-series:
    description: Required Xcode major series (26 or 27).
    required: false
    default: '26'
runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      env:
        UBM_XCODE_SERIES: ${{ inputs.xcode-series }}
      run: node scripts/ci/select-xcode.js --series "$UBM_XCODE_SERIES"
