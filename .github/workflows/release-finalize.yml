name: Finalize 4.0.0 release candidate

on:
  push:
    branches:
      - agent/release-4.0.0-docs

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: agent/release-4.0.0-docs
          fetch-depth: 0

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Prepare stable metadata and release guards
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')

          function read(path) { return fs.readFileSync(path, 'utf8') }
          function write(path, value) { fs.writeFileSync(path, value) }
          function replaceRequired(path, from, to) {
            const source = read(path)
            if (!source.includes(from)) throw new Error(`${path}: expected text not found: ${from.slice(0, 100)}`)
            write(path, source.replace(from, to))
          }

          const pkgPath = 'package.json'
          const pkg = JSON.parse(read(pkgPath))
          pkg.version = '4.0.0'
          pkg.description = 'Unified Bluetooth Low Energy manager for React Native, Electron, Web, and desktop'
          pkg.repository = { type: 'git', url: 'git+https://github.com/sfourdrinier/unified-ble-manager.git' }
          pkg.license = 'Apache-2.0'
          pkg.bugs = { url: 'https://github.com/sfourdrinier/unified-ble-manager/issues' }
          pkg.homepage = 'https://github.com/sfourdrinier/unified-ble-manager#readme'
          write(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`)

          replaceRequired(
            'src/implementation-version.ts',
            "export const UNIFIED_BLE_IMPLEMENTATION_VERSION = '4.0.0-alpha.40'",
            "export const UNIFIED_BLE_IMPLEMENTATION_VERSION = '4.0.0'"
          )

          replaceRequired(
            'unified-ble-manager.podspec',
            's.source       = { :git => "https://github.com/sfourdrinier/react-native-ble-plx.git", :tag => "v#{s.version}" }',
            's.source       = { :git => "https://github.com/sfourdrinier/unified-ble-manager.git", :tag => "v#{s.version}" }'
          )

          // Public/current guides should name the stable package. Historical changelogs,
          // reviews, evidence records, and the migration-checkpoint paragraph retain alpha.40.
          const currentGuides = [
            'README.md', 'RELEASE.md', 'ROADMAP.4.0.md', 'docs/GAPS.4.0.md',
            'docs/GETTING_STARTED.md', 'docs/PLATFORMS.md', 'docs/ELECTRON.md',
            'docs/NODE.md', 'docs/EXPO_PLUGIN.md', 'docs/BACKGROUND.md', 'docs/WEB.md',
            'docs/TVOS.md', 'docs/PERFORMANCE.md', 'docs/BONDING.md',
            'docs/CONNECTION_MANAGER.md', 'docs/HELPERS.md', 'example/README.md',
            'example-web/README.md', 'example-electron/README.md'
          ]
          for (const path of currentGuides) {
            if (!fs.existsSync(path)) continue
            write(path, read(path).replaceAll('unified-ble-manager@4.0.0-alpha.40', 'unified-ble-manager@4.0.0'))
          }

          // The strict evidence-manifest validator remains useful for support-qualification
          // bundles, but it follows the canonical main branch and is not the SemVer publish gate.
          let validator = read('scripts/evidence/validate-stable-release.js')
          validator = validator
            .replaceAll('refs/remotes/origin/master', 'refs/remotes/origin/main')
            .replaceAll('tag/master ancestry', 'tag/main ancestry')
          write('scripts/evidence/validate-stable-release.js', validator)

          const evidenceReadme = read('evidence/v1/README.md')
          const sectionStart = evidenceReadme.indexOf('## Stable GA publication gate')
          const sectionEnd = evidenceReadme.indexOf('## Current Phase 0 records')
          if (sectionStart < 0 || sectionEnd <= sectionStart) throw new Error('evidence README stable-gate section not found')
          const strictSection = `## Strict support-qualification manifest\n\nThe evidence system also supports an optional, stricter versioned manifest at\n\`evidence/v1/releases/vX.Y.Z.json\`, validated by\n\`scripts/evidence/validate-stable-release.js\`. This binds a package artifact,\nsource commit, approved CI run, generated support matrix, policy receipts, and\nrequired platform/host evidence into one fail-closed support-qualification bundle.\n\nThis strict manifest is **not required merely to publish a stable SemVer package**.\nStable package SemVer describes the public package/API compatibility contract;\nbackend Preview, Supported, and Reliability-qualified labels remain independently\nderived from retained evidence. A release must never manufacture, backdate, or\nrelabel physical-radio evidence to satisfy a version-number gate.\n\nWhen a strict qualification manifest is produced, its evidence-only descendant\nmodel remains intentional: the manifest cannot contain its own Git commit hash, so\nthe validator permits only evidence/generated-support changes between the tested\nsource commit and the qualified tag commit and verifies ancestry against canonical\n\`main\`.\n\n`
          write('evidence/v1/README.md', evidenceReadme.slice(0, sectionStart) + strictSection + evidenceReadme.slice(sectionEnd))

          // Stable cutover: update tests that intentionally guarded the prerelease train.
          replaceRequired(
            '__tests__/Phase0Identity.test.js',
            "test('npm package name and 4.0.0-alpha version train', () => {\n    expect(pkg.name).toBe('unified-ble-manager')\n    expect(pkg.version).toMatch(/^4\\.0\\.0-alpha\\./)\n  })",
            "test('npm package name and stable 4.0.0 identity', () => {\n    expect(pkg.name).toBe('unified-ble-manager')\n    expect(pkg.version).toBe('4.0.0')\n  })"
          )
          replaceRequired(
            '__tests__/Phase0Identity.test.js',
            "expect(mig).toContain('current published 4.0 prerelease')\n    expect(mig).toContain('unified-ble-manager@4.0.0-alpha.40')",
            "expect(mig).toContain('stable `unified-ble-manager@4.0.0`')\n    expect(mig).toContain('v4.0.0-alpha.40')"
          )

          for (const path of [
            '__tests__/G6APackedConsumerProof.test.js',
            '__tests__/GeneratedPlatformSupport.test.js',
            '__tests__/PerformanceBenchmarks.test.js'
          ]) {
            write(path, read(path).replaceAll('4.0.0-alpha.40', '4.0.0'))
          }

          let honesty = read('__tests__/Docs4.0.honesty.test.js')
          honesty = honesty.replace(
            "const alphaVersionMatch = /^4\\.0\\.0-alpha\\.(\\d+)$/u.exec(packageVersion)\nif (alphaVersionMatch === null) throw new Error(`Expected a 4.0 alpha package version, received ${packageVersion}`)\nconst currentAlpha = Number(alphaVersionMatch[1])\nconst previousAlphaVersion = `v4.0.0-alpha.${String(currentAlpha - 1)}`",
            "const stable40 = packageVersion === '4.0.0'\nconst alphaVersionMatch = /^4\\.0\\.0-alpha\\.(\\d+)$/u.exec(packageVersion)\nif (!stable40 && alphaVersionMatch === null) throw new Error(`Expected 4.0.0 or a 4.0 alpha package version, received ${packageVersion}`)\nconst currentAlpha = alphaVersionMatch === null ? null : Number(alphaVersionMatch[1])\nconst previousAlphaVersion = currentAlpha === null ? null : `v4.0.0-alpha.${String(currentAlpha - 1)}`"
          )
          honesty = honesty.replace(
            "  test('current public documentation cannot drift behind the package prerelease', () => {\n    for (const document of architectureAuthorityDocuments) {\n      const withoutDeclaredPreviousRelease = read(document).replaceAll(previousAlphaVersion, '')\n      const alphaReferences = [...withoutDeclaredPreviousRelease.matchAll(/alpha\\.(\\d+)/gu)]\n      for (const reference of alphaReferences) {\n        expect(Number(reference[1])).toBe(currentAlpha)\n      }\n    }\n  })",
            "  test('current public documentation follows the package release channel', () => {\n    if (stable40) {\n      expect(packageVersion).toBe('4.0.0')\n      return\n    }\n    for (const document of architectureAuthorityDocuments) {\n      const withoutDeclaredPreviousRelease = read(document).replaceAll(previousAlphaVersion, '')\n      const alphaReferences = [...withoutDeclaredPreviousRelease.matchAll(/alpha\\.(\\d+)/gu)]\n      for (const reference of alphaReferences) {\n        expect(Number(reference[1])).toBe(currentAlpha)\n      }\n    }\n  })"
          )
          write('__tests__/Docs4.0.honesty.test.js', honesty)

          let ciRelease = read('__tests__/CiRelease.canonicalPackage.test.js')
          ciRelease = ciRelease.replace(
            "  test('RELEASE.md makes the clean-baseline plan the 4.0 publication authority', () => {\n    const doc = read('RELEASE.md')\n    expect(doc).toContain('unified-ble-manager')\n    expect(doc).toContain('@sfourdrinier/react-native-ble-plx')\n    expect(doc).toContain('UNIFIED_BLE_4.0_IMPLEMENTATION_PLAN.md')\n    expect(doc).toContain('does not authorize publishing 4.0')\n    expect(doc).toContain('no permanent scoped shim')\n    expect(doc).toContain('packed artifact')\n    expect(doc).not.toMatch(/publishes the \\*\\*4\\.0 dual identity\\*\\*/i)\n  })",
            "  test('RELEASE.md defines canonical stable 4.0 publication from main', () => {\n    const doc = read('RELEASE.md')\n    expect(doc).toContain('sfourdrinier/unified-ble-manager')\n    expect(doc).toContain('Release branch: `main`')\n    expect(doc).toContain('Stable SemVer and platform support qualification are independent')\n    expect(doc).toContain('git tag -a v4.0.0')\n    expect(doc).toContain('npm trusted publisher')\n    expect(doc).not.toMatch(/publishes the \\*\\*4\\.0 dual identity\\*\\*/i)\n  })"
          )
          ciRelease = ciRelease.replace(
            "  test('verify-release omits the retired web example while RELEASE stays plan-gated', () => {\n    const sh = read('scripts/verify-release.sh')\n    const release = read('RELEASE.md')\n    expect(sh).not.toMatch(/vite build|example-web\\/vite\\.config\\.js/)\n    expect(release).toContain('controlling plan')\n    expect(release).toContain('packed artifact')\n  })",
            "  test('verify-release omits the retired web example while RELEASE stays artifact-gated', () => {\n    const sh = read('scripts/verify-release.sh')\n    const release = read('RELEASE.md')\n    expect(sh).not.toMatch(/vite build|example-web\\/vite\\.config\\.js/)\n    expect(release).toContain('SBOM.cdx.json')\n    expect(release).toContain('canonical CI is green')\n  })"
          )
          write('__tests__/CiRelease.canonicalPackage.test.js', ciRelease)

          let stableTest = read('__tests__/StableReleaseGate.test.js')
          const oldGateTest = `  test('runs the GA evidence gate only for final version tags', () => {\n    const workflow = fs.readFileSync(path.join(repositoryRoot, '.github', 'workflows', 'publish.yml'), 'utf8')\n    const releaseGuide = fs.readFileSync(path.join(repositoryRoot, 'RELEASE.md'), 'utf8')\n    const evidenceGuide = fs.readFileSync(path.join(repositoryRoot, 'evidence', 'v1', 'README.md'), 'utf8')\n    expect(workflow).toContain('id: release_channel')\n    expect(workflow).toContain('echo \"is_stable=false\" >> \"$GITHUB_OUTPUT\"')\n    expect(workflow).toContain('echo \"is_stable=true\" >> \"$GITHUB_OUTPUT\"')\n    expect(workflow).toContain(\"if: steps.release_channel.outputs.is_stable == 'true'\")\n    expect(workflow).toContain('fetch-depth: 0')\n    expect(workflow).toContain('git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master')\n    expect(workflow).toContain('--publish-tarball \"${PUBLISH_TARBALL}\"')\n    expect(workflow).toContain('npm publish \"${PUBLISH_TARBALL}\" --provenance --access public --tag \"${NPM_DIST_TAG}\"')\n    expect(workflow).toContain('npm view \"unified-ble-manager@${VER}\" dist.tarball --json')\n    expect(workflow).toContain('for ATTEMPT in $(seq 1 12)')\n    expect(workflow).toContain('npm registry metadata did not become visible within the bounded retry window')\n    expect(workflow).toContain('Registry tarball SHA-256 does not match the exact generated publish tarball')\n    expect(workflow).toContain(\"curl --fail --location --silent --show-error --proto '=https'\")\n    expect(releaseGuide).toContain('evidence-only release commit')\n    expect(evidenceGuide).toContain('evidence-only descendant')\n  })`
          const newGateTest = `  test('publishes stable SemVer from current main while retaining strict evidence qualification separately', () => {\n    const workflow = fs.readFileSync(path.join(repositoryRoot, '.github', 'workflows', 'publish.yml'), 'utf8')\n    const releaseGuide = fs.readFileSync(path.join(repositoryRoot, 'RELEASE.md'), 'utf8')\n    const evidenceGuide = fs.readFileSync(path.join(repositoryRoot, 'evidence', 'v1', 'README.md'), 'utf8')\n    expect(workflow).toContain('id: release_channel')\n    expect(workflow).toContain('echo \"is_stable=false\" >> \"$GITHUB_OUTPUT\"')\n    expect(workflow).toContain('echo \"is_stable=true\" >> \"$GITHUB_OUTPUT\"')\n    expect(workflow).toContain(\"if: steps.release_channel.outputs.is_stable == 'true'\")\n    expect(workflow).toContain('fetch-depth: 0')\n    expect(workflow).toContain('git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main')\n    expect(workflow).toContain('Verify stable tag points at current main')\n    expect(workflow).not.toContain('node scripts/evidence/validate-stable-release.js')\n    expect(workflow).toContain('npm publish \"${PUBLISH_TARBALL}\" --provenance --access public --tag \"${NPM_DIST_TAG}\"')\n    expect(workflow).toContain('npm view \"unified-ble-manager@${VER}\" dist.tarball --json')\n    expect(workflow).toContain('for ATTEMPT in $(seq 1 12)')\n    expect(workflow).toContain('Registry tarball SHA-256 does not match the exact generated publish tarball')\n    expect(releaseGuide).toContain('Stable SemVer and platform support qualification are independent')\n    expect(evidenceGuide).toContain('Strict support-qualification manifest')\n  })`
          if (!stableTest.includes(oldGateTest)) throw new Error('StableReleaseGate publication test block not found')
          stableTest = stableTest.replace(oldGateTest, newGateTest)
          stableTest = stableTest.replaceAll('refs/remotes/origin/master', 'refs/remotes/origin/main')
          write('__tests__/StableReleaseGate.test.js', stableTest)
          NODE

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Regenerate version-bound docs and dependency artifacts
        run: |
          pnpm docs:backend-sdk
          pnpm release:artifacts

      - name: Validate release candidate
        run: |
          pnpm validate:evidence
          pnpm test:package
          pnpm test:plugin
          pnpm lint
          pnpm docs:check
          pnpm release:artifacts:check
          node scripts/ci/pack-install-smoke.js
          npm pack --dry-run

      - name: Commit finalized candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/implementation-version.ts unified-ble-manager.podspec \
            SBOM.cdx.json THIRD_PARTY_LICENSES.json docs/generated \
            README.md RELEASE.md ROADMAP.4.0.md docs/GAPS.4.0.md docs/GETTING_STARTED.md \
            docs/PLATFORMS.md docs/ELECTRON.md docs/NODE.md docs/EXPO_PLUGIN.md docs/BACKGROUND.md \
            docs/WEB.md docs/TVOS.md docs/PERFORMANCE.md docs/BONDING.md docs/CONNECTION_MANAGER.md \
            docs/HELPERS.md example/README.md example-web/README.md example-electron/README.md \
            evidence/v1/README.md scripts/evidence/validate-stable-release.js \
            __tests__/Phase0Identity.test.js __tests__/G6APackedConsumerProof.test.js \
            __tests__/GeneratedPlatformSupport.test.js __tests__/PerformanceBenchmarks.test.js \
            __tests__/Docs4.0.honesty.test.js __tests__/CiRelease.canonicalPackage.test.js \
            __tests__/StableReleaseGate.test.js
          git diff --cached --check
          git commit -m 'release: prepare unified-ble-manager 4.0.0'
          git push origin HEAD:agent/release-4.0.0-docs
