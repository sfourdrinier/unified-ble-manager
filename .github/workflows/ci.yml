# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  package:
    name: JS/package (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20.19.4'
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Python for native Node-API builds
        if: (runner.os == 'macOS' || runner.os == 'Windows') && matrix.node == '22'
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'

      - name: Setup JS package
        uses: ./.github/actions/setup-js-package
        with:
          prepack: 'false'
          node-version: ${{ matrix.node }}

      - name: Validate evidence records
        run: pnpm validate:evidence

      - name: Run package tests
        run: pnpm test:package

      - name: Run plugin tests
        run: pnpm test:plugin

      - name: Lint and typecheck
        if: runner.os == 'Linux' && matrix.node == '22'
        run: pnpm lint

      - name: Execute native protocol C++ host tests
        if: runner.os == 'Linux' && matrix.node == '22'
        run: pnpm test:native-protocol

      - name: Build package artifacts
        if: matrix.node == '22'
        run: pnpm prepack

      - name: Build Web Bluetooth example
        if: runner.os == 'Linux' && matrix.node == '22'
        run: pnpm build:example:web

      - name: Production performance benchmark
        if: runner.os == 'Linux' && matrix.node == '22'
        run: pnpm performance:check

      - name: Verify reproducible SBOM and production licenses
        if: runner.os == 'Linux' && matrix.node == '22'
        run: pnpm release:artifacts:check

      - name: Electron deterministic smoke
        if: runner.os == 'Linux' && matrix.node == '22'
        run: node example-electron/smoke.js

      - name: Verify canonical host exports
        if: runner.os == 'Linux' && matrix.node == '22'
        run: node scripts/ci/check-host-exports.js

      - name: Electron main-process smoke
        if: runner.os == 'Linux' && matrix.node == '22'
        run: ./node_modules/.bin/electron --no-sandbox scripts/ci/electron-main-smoke.js

      - name: Canonical pack/install smoke
        if: runner.os == 'Linux' && matrix.node == '22'
        run: node scripts/ci/pack-install-smoke.js

      - name: CoreBluetooth Node-API boundary build and load
        if: runner.os == 'macOS' && matrix.node == '22'
        env:
          npm_config_python: ${{ env.pythonLocation }}/bin/python
        run: |
          set -euo pipefail
          pnpm run build:electron:macos
          test -f native/electron/corebluetooth/build/Release/unified_ble_corebluetooth.node
          node - <<'NODE'
          const { createNativeCoreBluetoothBoundary } = require('./lib/commonjs/node-corebluetooth')
          const boundary = createNativeCoreBluetoothBoundary()
          const required = [
            'adapterSnapshot', 'startScan', 'stopScan', 'connect', 'disconnect',
            'connectionState', 'discover', 'read', 'write', 'startNotify',
            'stopNotify', 'onDisconnect', 'onAdapterState', 'destroy'
          ]
          for (const method of required) {
            if (typeof boundary[method] !== 'function') throw new Error(`Missing CoreBluetooth method: ${method}`)
          }
          Promise.resolve(boundary.destroy()).catch(error => {
            console.error(error)
            process.exitCode = 1
          })
          NODE

      - name: CoreBluetooth Electron ABI rebuild and load
        if: runner.os == 'macOS' && matrix.node == '22'
        run: |
          set -euo pipefail
          ELECTRON_VERSION="$(node -p "require('./node_modules/electron/package.json').version")"
          (
            cd native/electron/corebluetooth
            ../../../node_modules/.bin/node-gyp rebuild \
              --target="$ELECTRON_VERSION" \
              --arch="$(node -p 'process.arch')" \
              --dist-url=https://electronjs.org/headers
          )
          test -f native/electron/corebluetooth/build/Release/unified_ble_corebluetooth.node
          ./node_modules/.bin/electron scripts/ci/electron-main-smoke.js

      - name: WinRT Node-API boundary build and load
        if: runner.os == 'Windows' && matrix.node == '22'
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build:electron:winrt
          test -f native/electron/winrt/build/Release/unified_ble_winrt.node
          node - <<'NODE'
          const native = require('./native/electron/winrt')
          if (native.boundaryVersion !== 2 || typeof native.createContractBoundary !== 'function') {
            throw new Error('WinRT addon does not expose boundary protocol v2')
          }
          const boundary = native.createContractBoundary()
          Promise.resolve(boundary.destroy().completion).catch(error => {
            console.error(error)
            process.exitCode = 1
          })
          NODE

      - name: WinRT Electron ABI rebuild and load
        if: runner.os == 'Windows' && matrix.node == '22'
        shell: bash
        run: |
          set -euo pipefail
          ELECTRON_VERSION="$(node -p "require('./node_modules/electron/package.json').version")"
          (
            cd native/electron/winrt
            ../../../node_modules/.bin/node-gyp rebuild \
              --target="$ELECTRON_VERSION" \
              --arch="$(node -p 'process.arch')" \
              --dist-url=https://electronjs.org/headers
          )
          test -f native/electron/winrt/build/Release/unified_ble_winrt.node
          ./node_modules/.bin/electron scripts/ci/electron-main-smoke.js

  changes:
    name: Detect native path changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Filter paths
        uses: dorny/paths-filter@v4.0.2
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'native/protocol/**'
              - 'scripts/native-protocol/**'
              - 'plugin/**'
              - 'example/android/**'
              - 'example-expo/**'
              - 'app.plugin.js'
              - 'src/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
              - '.github/actions/**'
            apple:
              - 'ios/**'
              - 'native/protocol/**'
              - 'scripts/native-protocol/**'
              - 'example/ios/**'
              - 'example/package.json'
              - 'example/**/Gemfile*'
              - 'example-expo/**'
              - 'plugin/**'
              - 'app.plugin.js'
              - 'unified-ble-manager.podspec'
              - 'src/**'
              - 'scripts/ci/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'native/electron/**'
              - 'example-electron/**'

  classic-rn-android:
    name: Classic RN Android assemble
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g\ -XX:MaxMetaspaceSize=1g\ -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Setup JS package
        uses: ./.github/actions/setup-js-package
      - name: Setup Java
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1
      - name: Install example dependencies
        run: pnpm --dir example install --no-frozen-lockfile
      - name: Run Android native protocol tests
        run: pnpm test:native-protocol:android
      - name: Assemble classic example
        working-directory: example/android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

  expo-cng-android:
    name: Expo CNG Android build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Setup JS package
        uses: ./.github/actions/setup-js-package
      - name: Setup Java
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1
      - name: Install Expo dependencies
        run: pnpm --dir example-expo install --no-frozen-lockfile
      - name: Align Expo dependencies
        working-directory: example-expo
        run: npx expo install --fix
      - name: Typecheck Expo example
        run: pnpm --dir example-expo exec tsc --noEmit -p tsconfig.json
      - name: Run Expo Doctor
        working-directory: example-expo
        run: NODE_ENV=development npx expo-doctor
      - name: Prebuild Expo native projects
        working-directory: example-expo
        run: NODE_ENV=development npx expo prebuild --clean --no-install
      - name: Assemble Expo Android app
        working-directory: example-expo/android
        run: NODE_ENV=development ./gradlew :app:assembleDebug --no-daemon --console=plain

  apple:
    name: Apple compile checks
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.apple == 'true'
    uses: ./.github/workflows/apple-ci.yml
