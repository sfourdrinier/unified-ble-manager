# .github/workflows/ci.yml

name: CI

# Cost policy (#20):
# - package: every PR push, plus pushes to main, release/**, and the 5.0.0 lane base (cheap Ubuntu)
# - expo-cng-android: only when Android/native-related paths change (or manual)
# - Apple (macOS): NOT on every PR commit. Runs on:
#     • push to main when Apple-related paths change
#     • pull_request with label `ci:apple` (opt-in before merge)
#     • the 5.0.0 release lane: PRs targeting 5.0.0, and pushes to 5.0.0,
#       when Apple-related paths change (RV5 finding 5)
#     • workflow_dispatch (manual)
# Superseded runs for the same PR/branch are cancelled.

on:
  push:
    branches:
      - main
      # Release branches are validated on push as well as on their PRs: a
      # release branch accumulates several merged PRs, and the combination is
      # what ships, so the integrated branch has to be gated in its own right.
      - 'release/**'
      # UBM 5.0 lane base: worker branches target 5.0.0 (never main), so the
      # lane base gets the same push gating as main and release branches.
      - '5.0.0'
  pull_request:
    branches:
      - main
      - 'agent/**'
      # Without this, retargeting a PR onto a release branch silently removes
      # CI from it: no workflow triggers, `gh pr checks` reports nothing, and
      # the PR still shows the stale green from when it targeted main.
      - 'release/**'
      # UBM 5.0 lane: PRs targeting the 5.0.0 base get the normal checks.
      - '5.0.0'
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:

# Official concurrency docs:
# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
# Group includes workflow name so we never cancel publish.yml; PR number keeps
# each PR isolated; github.ref covers branch/tag pushes.
# Do not cancel in-progress CI when someone applies an unrelated PR label —
# that would replace a real package run with a skipped/success check (Codex P1).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'ci:apple') }}

# Hardened defaults: paths-filter needs pull-requests:read on pull_request events
# (dorny/paths-filter PR files API). Checkout needs contents:read.
permissions:
  contents: read
  pull-requests: read

jobs:
  tauri-plugin:
    name: Tauri v2 Rust (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-native-system-dependencies.sh tauri

      - name: Install stable Rust components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path native/tauri/Cargo.toml -- --check

      - name: Test Tauri plugin crate
        run: cargo test --manifest-path native/tauri/Cargo.toml

      - name: Reject Rust warnings
        run: cargo clippy --manifest-path native/tauri/Cargo.toml -- -D warnings

      - name: Compile independent Tauri proving consumer
        # --locked: the example is an app, so its lockfile is a shipped artifact.
        # Without this Cargo silently rewrites a stale lock and the job passes,
        # which is how a missing dependency edge reached a release tag.
        run: cargo check --manifest-path example-tauri/src-tauri/Cargo.toml --locked

  # Always run JS/package tests — including labeled events — so required checks
  # never get replaced by a skipped success from an unrelated label.
  # Multi-OS matrix: pure TS / Jest port+host tests run on Ubuntu, Windows, macOS.
  # Linux matrices Node 22 (engines mid), Node 24 (publish line). Node 20 removed — package engines floor is 22+.
  # Job name is honest: lint/prepack/multi-host smoke run only on Linux (R2-F096).
  package:
    name: JS tests (${{ matrix.os }}, Node ${{ matrix.node }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Python for native Node22 builds
        if: (runner.os == 'macOS' || runner.os == 'Windows') && matrix.node == '22'
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'

      - name: Setup JS package
        uses: ./.github/actions/setup-js-package
        with:
          prepack: 'false'
          node-version: ${{ matrix.node }}

      - name: Install pinned Rust
        # ReleaseArtifacts/License suites shell to
        # `cargo metadata --locked --offline`; cargo --version resolves
        # rust-toolchain.toml and installs the pinned toolchain when absent.
        run: cargo --version

      - name: Warm cargo cache for offline metadata
        # No compilation (no sysdeps needed) — populates the cargo cache so
        # offline metadata reads succeed on a fresh runner.
        run: cargo fetch --locked

      - name: Install Tauri Linux system dependencies for packed consumer
        # The packed-consumer proof compiles a real external Tauri application.
        # Its GTK/WebKit dependencies are consumer prerequisites, not supplied
        # by the Rust crate, so this lane must match the dedicated Tauri job.
        if: runner.os == 'Linux' && matrix.node == '22'
        run: bash scripts/ci/install-linux-native-system-dependencies.sh tauri

      - name: Install Linux build sysdeps (Node 24)
        # napi -> ubm-desktop -> btleplug -> bluez-async -> libdbus-sys needs
        # pkg-config + D-Bus headers at compile time (same subset as the
        # rust-parity-5-0 job). The Node 22 lane installs this subset as part
        # of the full Tauri consumer prerequisites above.
        if: runner.os == 'Linux' && matrix.node == '24'
        run: bash scripts/ci/install-linux-native-system-dependencies.sh bluez

      - name: Build NAPI dispatch addon (R03 converged path)
        # The bluez-rust-core-routing converged-path tests require the REAL
        # addon (bindings/napi/ubm_echo.<platform>-<arch>.node); a fresh
        # runner has no staged binary, so build it on every leg before jest.
        # (pretest:package rebuilds it too — this explicit step keeps addon
        # failures diagnosable apart from jest.)
        run: node scripts/ci/build-napi-addon.js

      - name: Build UniFFI mobile host for the Apple harness
        # AppleNativeProtocolV2.test.js executes the Apple harness, which links
        # the real Rust mobile host. Building it here, once, keeps the cold
        # Rust compile out of the jest run (where it shares the runner with
        # the whole suite); the harness's own `cargo build --locked` then only
        # confirms it is fresh.
        if: runner.os == 'macOS'
        run: cargo build --locked -p ubm5_uniffi_echo

      - name: Run package tests
        run: pnpm test:package

      - name: Validate current evidence records
        run: pnpm validate:evidence

      # F9 / RV5 finding 4: the committed Android jniLibs travel with the
      # push. Check freshness on every PR here (not only in the Android
      # jobs) so a Rust-only change that outruns its refresh fails fast.
      - name: Committed Android prebuilts match the sources
        if: runner.os == 'Linux'
        run: pnpm native:status --only android

      - name: Run plugin tests
        run: pnpm test:plugin

      # C++ codec/runtime execution only. It compiles and runs the host harness,
      # but cannot prove a physical adapter, peripheral, or radio lifecycle.
      - name: Execute Native Protocol C++ host tests (L2; no physical radio)
        if: runner.os == 'Linux' && matrix.node == '22'
        run: pnpm test:native-protocol

      # Lint/typecheck + prepack once on Linux (path/tooling quirks differ on Windows)
      - name: Lint and typecheck
        if: runner.os == 'Linux'
        run: pnpm lint

      - name: Build package artifacts
        if: runner.os == 'Linux'
        run: pnpm prepack

      # Compile a fresh external Cargo root immediately after prepack. Keep
      # this before generated-artifact, desktop and packed-consumer gates so a
      # broken Tauri consumer or runner setup fails fast.
      - name: Packed external Tauri Cargo consumer proof
        if: runner.os == 'Linux' && matrix.node == '22'
        run: node scripts/ci/tauri-packed-consumer-check.js

      # RV5 finding 6: generated artifacts (API reports, PLATFORM_SUPPORT)
      # must match the sources on every PR, not only under preflight.
      - name: Generated artifacts match the sources
        if: runner.os == 'Linux'
        run: pnpm run docs:check

      - name: Build 4.0 Web Bluetooth public example
        if: runner.os == 'Linux' && matrix.node == '22'
        run: pnpm build:example:web

      - name: Production performance benchmark gate (host-native + JS)
        if: runner.os == 'Linux' && matrix.node == '22'
        run: pnpm performance:check

      - name: Reproducible SBOM and production-license audit
        if: runner.os == 'Linux' && matrix.node == '22'
        run: pnpm release:artifacts:check

      # L1 only: Fake multi-device demo under Node (not Electron binary / native radio).
      - name: Electron Fake multi-device demo smoke (L1)
        if: runner.os == 'Linux'
        run: node example-electron/smoke.js

      # The full package suite above covers the public backend and package boundaries;
      # the release workflow does not repeat individual suites here.

      # L2 needs compiled hosts (src/*.ts is not resolvable by plain Node). prepack is Linux-only above;
      # emit lib/ here before requireNative probes (R2-F005).
      - name: Build package artifacts (macOS/Windows L2 hosts)
        if: (runner.os == 'macOS' && matrix.node == '22') || (runner.os == 'Windows' && matrix.node == '22')
        run: pnpm prepack

      # L2: compile the CoreBluetooth Node-API addon, then load the public 4.0
      # contract boundary directly. No legacy BlePort host participates in this gate.
      - name: CoreBluetooth native boundary L2 (node-gyp Node ABI + public boundary)
        if: runner.os == 'macOS' && matrix.node == '22'
        env:
          npm_config_python: ${{ env.pythonLocation }}/bin/python
        run: |
          set -euo pipefail
          pnpm run build:electron:macos
          test -f native/electron/corebluetooth/build/Release/unified_ble_corebluetooth.node
          node -e "
            const publicEntry = require('./lib/commonjs/node-corebluetooth');
            if (typeof publicEntry.createCoreBluetoothBleManager !== 'function' || 'createNativeCoreBluetoothBoundary' in publicEntry) {
              throw new Error('node/corebluetooth must expose the Rust-core factory and no legacy boundary');
            }
            const { createNativeCoreBluetoothBoundary } = require('./lib/commonjs/backends/corebluetooth/corebluetooth-native-boundary');
            const boundary = createNativeCoreBluetoothBoundary();
            const required = [
              'adapterSnapshot', 'startScan', 'stopScan', 'connect', 'disconnect',
              'connectionState', 'discover', 'read', 'write', 'startNotify',
              'stopNotify', 'onDisconnect', 'onAdapterState', 'destroy'
            ];
            for (const method of required) {
              if (typeof boundary[method] !== 'function') {
                throw new Error('CoreBluetooth boundary method is missing: ' + method);
              }
            }
            Promise.resolve(boundary.destroy()).then(() => {
              console.log('CoreBluetooth public boundary L2 ok');
            }, error => {
              console.error('CoreBluetooth boundary destroy failed:', error);
              process.exitCode = 1;
            });
          "

      # L3: Node ABI ≠ Electron ABI. Rebuild for Electron, then headless main-process smoke (R2-F037).
      # electron-main-smoke loads public Electron-main exports and the direct
      # CoreBluetooth boundary under the Electron ABI on macOS (R3-F012).
      # Not radio L4 — no BrowserWindow or live peripheral is involved.
      - name: Electron ABI rebuild + main-process smoke (L3, Node ABI ≠ Electron ABI)
        if: runner.os == 'macOS' && matrix.node == '22'
        run: |
          set -euo pipefail
          ELECTRON_VERSION=$(node -p "require('./node_modules/electron/package.json').version")
          (
            cd native/electron/corebluetooth
            ../../../node_modules/.bin/node-gyp rebuild \
              --target="$ELECTRON_VERSION" \
              --arch="$(node -p 'process.arch')" \
              --dist-url=https://electronjs.org/headers
          )
          test -f native/electron/corebluetooth/build/Release/unified_ble_corebluetooth.node
          ./node_modules/.bin/electron scripts/ci/electron-main-smoke.js

      # This is Node-API ABI and boundary-shape proof only. It does not claim a
      # live adapter, advertisement, peripheral, or radio-support result.
      - name: WinRT native boundary Node ABI build and load (Windows; no live radio)
        if: runner.os == 'Windows' && matrix.node == '22'
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build:electron:winrt
          test -f native/electron/winrt/build/Release/unified_ble_winrt.node
          node -e "
            const native = require('./native/electron/winrt');
            if (native.boundaryVersion !== 2 || typeof native.createContractBoundary !== 'function') {
              throw new Error('WinRT addon does not expose boundary protocol v2');
            }
            const boundary = native.createContractBoundary();
            const required = [
              'listAdapters', 'selectAdapter', 'adapterSnapshot', 'startScan', 'stopScan',
              'connect', 'disconnect', 'discover', 'read', 'write', 'readDescriptor',
              'writeDescriptor', 'startNotify', 'stopNotify', 'onConnectionLost',
              'onDatabaseChanged', 'onAdapterState', 'onSecurityState', 'onScanTerminal',
              'securityState', 'pair', 'cancelPairing', 'unpair', 'ingressTelemetry', 'destroy'
            ];
            for (const method of required) {
              if (typeof boundary[method] !== 'function') {
                throw new Error('WinRT boundary method is missing: ' + method);
              }
            }
            boundary.destroy().completion.then(() => {
              console.log('WinRT Node-API compile and ABI load passed; no live-radio test ran.');
            }, error => {
              console.error('WinRT native destroy after ABI load failed:', error);
              process.exitCode = 1;
            });
          "

      # Rebuild the actual addon for Electron's Node ABI, then load the public
      # WinRT boundary from Electron main. This remains compile/load evidence;
      # electron-main-smoke does not start a scan or claim live-radio support.
      - name: WinRT native boundary Electron ABI rebuild and load (Windows; no live radio)
        if: runner.os == 'Windows' && matrix.node == '22'
        shell: bash
        run: |
          set -euo pipefail
          ELECTRON_VERSION=$(node -p "require('./node_modules/electron/package.json').version")
          (
            cd native/electron/winrt
            ../../../node_modules/.bin/node-gyp rebuild \
              --target="$ELECTRON_VERSION" \
              --arch="$(node -p 'process.arch')" \
              --dist-url=https://electronjs.org/headers
          )
          test -f native/electron/winrt/build/Release/unified_ble_winrt.node
          ./node_modules/.bin/electron scripts/ci/electron-main-smoke.js

      # L2 packaging: resolve every canonical host entrypoint after prepack.
      - name: Canonical host export resolve (L2)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          node scripts/ci/check-host-exports.js

      # L3 wiring under the Electron binary on Linux. This uses Electron's
      # documented CI-safe no-sandbox mode and still executes the public smoke.
      - name: Electron main-process public-boundary smoke under Electron binary (L3, Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ./node_modules/.bin/electron --no-sandbox scripts/ci/electron-main-smoke.js

      # BlueZ soft-probe: never silent success; skip explicitly when daemon/adapter absent (R2-F038 / GAP-CI-LIN).
      - name: BlueZ system soft-probe (L2/L3 soft; mock Jest remains L1)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if ! command -v systemctl >/dev/null 2>&1; then
            echo "systemctl missing — skipped BlueZ L3 soft-probe (mock Jest remains L1)"
            exit 0
          fi
          if ! systemctl is-active --quiet bluetooth 2>/dev/null; then
            echo "bluetooth service inactive — skipped BlueZ L3 (mock Jest remains L1)"
            exit 0
          fi
          if command -v dbus-send >/dev/null 2>&1; then
            if ! dbus-send --system --dest=org.bluez --print-reply / org.freedesktop.DBus.Introspectable.Introspect >/dev/null 2>&1; then
              echo "BlueZ D-Bus soft-probe failed (daemon flagged active but no reply) — skipped L3"
              exit 0
            fi
          fi
          node scripts/ci/bluez-soft-probe.js

      # Real pack+install (not dry-run) — proves the canonical files allowlist and host exports (R2-F039).
      - name: Canonical npm pack + install export smoke
        if: runner.os == 'Linux'
        run: node scripts/ci/pack-install-smoke.js

      # Focused packed host proof; this consumes only the canonical tarball and
      # remains separate from the Node/Web-only G6A schema.
      - name: Packed Expo/Tauri consumer proof
        if: runner.os == 'Linux' && matrix.node == '22'
        run: node scripts/ci/packed-host-consumer-check.js

      # Independent G6A packed-consumer proof; keep separate from generic smoke to avoid artifact collisions.
      - name: G6A packed consumer proof
        if: runner.os == 'Linux' && matrix.node == '22'
        run: node scripts/ci/g6a-packed-consumer-proof.js

      # RV5 finding 2: the TCK test-only packaging proof runs here, next to
      # the G6A proof, after prepack above. It fails closed when the shipped
      # testing entry absorbs the test-only fault hooks.
      - name: TCK test-only packaging proof
        if: runner.os == 'Linux' && matrix.node == '22'
        run: node scripts/ci/check-tck-test-only-packaging.js

  # UBM 5.0 contract-freeze gate (U1): strict typecheck plus the frozen
  # contract suite. Runs on every CI invocation like `package`; see
  # contracts/README.md and contracts/RED_BASELINE.md.
  contracts:
    name: UBM 5.0 contracts (tsc + jest)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup JS package
        uses: ./.github/actions/setup-js-package
        with:
          prepack: 'false'
          node-version: '22'

      - name: Contracts typecheck
        run: pnpm contracts:typecheck

      - name: Contracts tests
        run: pnpm contracts:test

  # UBM 5.0 Rust workspace (pinned toolchain via rust-toolchain.toml).
  # Matrix covers all three hosted OSes; formatting is Linux-only (it is
  # platform-independent — same convention as the Tauri job).
  rust-5-0:
    name: Rust 5.0 workspace (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install pinned Rust components
        # cargo --version resolves rust-toolchain.toml and installs the
        # pinned toolchain when absent; components attach to it.
        run: |
          cargo --version
          rustup component add rustfmt clippy

      - name: Install Linux build sysdeps
        # ubm-desktop -> btleplug -> bluez-async -> libdbus-sys needs
        # pkg-config + D-Bus headers at compile time (same subset the
        # Tauri job installs).
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-native-system-dependencies.sh bluez

      - name: Check Rust formatting (workspace scope)
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Reject Rust warnings
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test Rust workspace
        # The mobile scripted-radio harness has a retained teardown race under
        # parallel libtest execution. Keep complete coverage while each test
        # case runs serially until the harness is made concurrency-safe.
        run: cargo test --locked -- --test-threads=1

  # UBM 5.0 Rust/JS parity (napi roundtrip + staged-fault proofs). Linux-only:
  # the napi toolchain build is host-sensitive and parity is OS-independent.
  rust-parity-5-0:
    name: Rust 5.0 parity (napi roundtrip)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup JS package
        uses: ./.github/actions/setup-js-package
        with:
          prepack: 'false'
          node-version: '22'

      - name: Install pinned Rust
        run: cargo --version

      - name: Install Linux build sysdeps
        # napi -> ubm-desktop -> btleplug -> bluez-async -> libdbus-sys needs
        # pkg-config + D-Bus headers at compile time (same subset as rust-5-0;
        # required since wave E wired the addon to the shared core).
        run: bash scripts/ci/install-linux-native-system-dependencies.sh bluez

      - name: Rust parity proofs
        run: pnpm test:parity

  # h10-sim: the Polar H10 simulator is a first-class tool — build and
  # unit-test it on Linux and macOS. No radio needed: unit tests, the
  # encoder cross-check, the driver-hello fixture check and the socket-free
  # driver suites. Kept small so the main gates stay fast.
  h10-sim:
    name: h10-sim (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install pinned Rust components
        # cargo --version resolves rust-toolchain.toml and installs the
        # pinned toolchain when absent; components attach to it.
        run: |
          cargo --version
          rustup component add rustfmt clippy

      - name: Install Linux build sysdeps
        # bluer -> libdbus-sys needs pkg-config + D-Bus headers at compile
        # time (same subset as rust-5-0).
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-native-system-dependencies.sh bluez

      - name: Setup JS package
        uses: ./.github/actions/setup-js-package
        with:
          prepack: 'false'
          node-version: '22'

      - name: Check sim formatting
        run: cargo fmt --manifest-path tool/h10-sim/Cargo.toml -- --check

      - name: Reject sim warnings
        run: cargo clippy --manifest-path tool/h10-sim/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test sim
        run: cargo test --manifest-path tool/h10-sim/Cargo.toml --locked

      - name: Cross-check encoders against TS parsers
        run: node tool/h10-sim/tests/xcheck/run-xcheck.cjs

      - name: Check driver-hello fixture is fresh
        # The platform and osVersion fields differ per OS (both carry
        # `std::env::consts::OS`), so both are excluded from the comparison;
        # everything else must match the binary byte for byte. The fixture is
        # never regenerated on one OS to satisfy the other.
        run: |
          cargo run --locked --quiet --manifest-path tool/h10-sim/Cargo.toml -- --emit-driver-hello > /tmp/h10-driver-hello.json
          node -e "const fs = require('fs'); const norm = p => { const o = JSON.parse(fs.readFileSync(p, 'utf8')); delete o.platform; delete o.osVersion; return JSON.stringify(o); }; if (norm('/tmp/h10-driver-hello.json') !== norm('tool/h10-sim/tests/driver-hello.json')) { console.error('tool/h10-sim/tests/driver-hello.json is stale: regenerate with h10-sim --emit-driver-hello'); process.exit(1); }"

      - name: Driver protocol and sequence tests
        run: node --test examples-shared/driver/__tests__/protocol.test.mjs examples-shared/driver/__tests__/peripheral-sim.test.mjs examples-shared/driver/__tests__/polar-pmd.test.mjs examples-shared/driver/server/__tests__/sequence-devices.test.mjs

  changes:
    name: Detect path changes
    timeout-minutes: 5
    if: |
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'ci:apple'
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Filter paths
        # Latest: https://github.com/dorny/paths-filter/releases (v4 = Node 24 runtime)
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - 'native/protocol/**'
              - 'scripts/native-protocol/**'
              - 'plugin/**'
              - 'example/android/**'
              - 'example-expo/**'
              - 'app.plugin.js'
              - 'src/**'
              # Rust trees feeding the committed jniLibs (bindings/jni path-
              # depends on every crate; the workspace vendors the radio):
              # a Rust-only change can stale build-identity.json, so it must
              # trigger the Android jobs (RV5 finding 4).
              - 'crates/**'
              - 'bindings/**'
              - 'vendor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            apple:
              - 'ios/**'
              - 'examples-shared/dev/**'
              - 'native/protocol/**'
              - 'scripts/native-protocol/**'
              - 'example/ios/**'
              - 'example/package.json'
              - 'example/**/Gemfile'
              - 'example/**/Gemfile.lock'
              - 'example-expo/**'
              - 'plugin/**'
              - 'app.plugin.js'
              - 'unified-ble-manager.podspec'
              - 'src/**'
              - 'scripts/ci/**'
              # Same Rust reasoning as android: bindings/uniffi path-depends
              # on every crate, so a Rust-only change must trigger the Apple
              # compile (RV5 finding 4).
              - 'crates/**'
              - 'bindings/**'
              - 'vendor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/apple-ci.yml'
              - '.github/actions/**'
              - 'native/electron/**'
              - 'example-electron/**'

  expo-cng-android:
    name: Expo CNG Android build
    timeout-minutes: 60
    needs: changes
    if: |
      !cancelled() &&
      needs.changes.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.android == 'true'
      )
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      # D2(iii): CI builds the Rust cdylib from source explicitly; packed
      # consumers get prebuilts by default without this variable.
      UBM_NATIVE_BUILD: source
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup JS package
        uses: ./.github/actions/setup-js-package

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          # Default is 'tools platform-tools'; the obsolete `tools` package
          # no longer exists upstream and fails install on new cmdline-tools.
          # The NDK is pinned explicitly: AGP auto-install flaked in CI
          # (InstallFailedException on a PR leg while the push leg passed).
          packages: 'platform-tools ndk;27.1.12297006'

      - name: Install pinned Rust + Android targets
        # buildUbmRustCdylib compiles bindings/jni via rustup-run on the
        # pinned toolchain (this job builds from source explicitly via
        # UBM_NATIVE_BUILD=source). Mirrors classic-rn-android: the Expo
        # job previously took the packed path and never needed targets.
        # The pin is single-sourced from rust-toolchain.toml — never
        # hardcode a version.
        run: |
          PINNED_TOOLCHAIN="$(grep -E '^channel[[:space:]]*=' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          test -n "$PINNED_TOOLCHAIN" || { echo "could not parse pinned toolchain channel from rust-toolchain.toml"; exit 1; }
          cargo --version
          rustup target add --toolchain "$PINNED_TOOLCHAIN" aarch64-linux-android x86_64-linux-android

      - name: Install Expo example dependencies
        run: pnpm --dir example-expo install --no-frozen-lockfile

      - name: Align Expo peer deps to installed SDK
        # package.json uses caret floors; let Expo pick compatible peers for the resolved SDK.
        working-directory: example-expo
        run: npx expo install --fix

      - name: Typecheck Expo example
        run: pnpm --dir example-expo exec tsc --noEmit -p tsconfig.json

      - name: Run Expo Doctor
        working-directory: example-expo
        run: NODE_ENV=development npx expo-doctor

      - name: Verify committed Android prebuilts match the sources
        # F9: the Gradle build consumes the committed jniLibs; fail here —
        # never on a stale artifact — when a Rust change outruns its refresh
        # (android/refresh-prebuilt-jniLibs.sh, committed by the maintainer).
        run: pnpm native:status --only android

      - name: Prebuild Expo native projects
        working-directory: example-expo
        run: NODE_ENV=development npx expo prebuild --clean --no-install

      - name: Build generated Android project
        working-directory: example-expo/android
        run: NODE_ENV=development ./gradlew :app:assembleDebug --no-daemon --console=plain

  # Classic RN example Android compile — same android/ library sources as Expo,
  # wired through the bare example app (not only CNG). Gated by android path filter.
  classic-rn-android:
    name: Classic RN Android assemble
    timeout-minutes: 60
    needs: changes
    if: |
      !cancelled() &&
      needs.changes.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.android == 'true'
      )
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      # JetifyTransform of react-android AAR OOM'd on default heap (see CI logs).
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g\ -XX:MaxMetaspaceSize=1g\ -Dfile.encoding=UTF-8
      # D2(iii): CI builds the Rust cdylib from source explicitly; packed
      # consumers get prebuilts by default without this variable.
      UBM_NATIVE_BUILD: source
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup JS package
        uses: ./.github/actions/setup-js-package

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          # Default is 'tools platform-tools'; the obsolete `tools` package
          # no longer exists upstream and fails install on new cmdline-tools.
          # The NDK is pinned explicitly: AGP auto-install flaked in CI
          # (InstallFailedException on a PR leg while the push leg passed).
          packages: 'platform-tools ndk;27.1.12297006'

      - name: Install pinned Rust + Android targets
        # buildUbmRustCdylib compiles bindings/jni via rustup-run on the
        # pinned toolchain for every ABI in android/build.gradle
        # (ubmRustAbis: arm64-v8a + x86_64). The pin is single-sourced
        # from rust-toolchain.toml (parsed here and by
        # android/build-rust-cdylib.sh) — never hardcode a version.
        run: |
          PINNED_TOOLCHAIN="$(grep -E '^channel[[:space:]]*=' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          test -n "$PINNED_TOOLCHAIN" || { echo "could not parse pinned toolchain channel from rust-toolchain.toml"; exit 1; }
          cargo --version
          rustup target add --toolchain "$PINNED_TOOLCHAIN" aarch64-linux-android x86_64-linux-android

      - name: Install classic example dependencies
        # example/.npmrc uses node-linker=hoisted so @react-native/gradle-plugin is at
        # example/node_modules/@react-native/gradle-plugin (required by settings.gradle).
        run: pnpm --dir example install --no-frozen-lockfile

      - name: Verify React Native gradle plugin path
        run: test -d example/node_modules/@react-native/gradle-plugin

      # Executes the package's JVM dispatcher command/result/event coverage;
      # no emulator, adapter, peripheral, or physical-radio assertion is made.
      - name: Execute Android Native Protocol dispatcher JVM tests (JVM; no physical BLE radio)
        run: pnpm test:native-protocol:android

      - name: Assemble classic example debug APK
        working-directory: example/android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

  # --- Apple compile checks (#20) ---
  # Compile/link only. No simulator boot, no BLE runtime (see #14).
  # Expensive: gated by main path changes, `ci:apple` label, the 5.0.0 lane
  # with Apple path changes (RV5 finding 5), or manual run.
  # Implementation lives in reusable workflow apple-ci.yml + composite actions under
  # .github/actions/ (select-xcode, setup-js-package) so we do not triple-copy jobs.
  apple:
    name: Apple compile checks
    needs: changes
    if: |
      !cancelled() &&
      needs.changes.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci:apple')
        ) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.changes.outputs.apple == 'true'
        ) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/5.0.0' &&
          needs.changes.outputs.apple == 'true'
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.base_ref == '5.0.0' &&
          needs.changes.outputs.apple == 'true'
        )
      )
    uses: ./.github/workflows/apple-ci.yml
