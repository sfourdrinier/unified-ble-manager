# .github/workflows/apple-ci.yml

# Reusable Apple compile checks (#20). Called from ci.yml when the Apple gate is open.
# Compile/link only — no simulator boot, no BLE runtime (see #14).
#
# Runner: macos-26 + Xcode 26.4+ (prefer 26.6; Expo SDK 57 needs Swift tools 6.2).
name: Apple CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ios-example:
    name: iOS example (BlePlxExample)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RCT_NEW_ARCH_ENABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Setup JS package
        uses: ./.github/actions/setup-js-package

      - name: Install pinned Rust + Apple targets
        # Source mode builds ios/RustCore/RustCore.xcframework with the
        # explicit `native:apple:prepare` step (ios/build-rust-core.sh)
        # before pod install; it needs the pinned toolchain plus the Apple device/simulator matrix
        # (aarch64-ios, aarch64-sim, x86_64-sim, aarch64-tvos,
        # aarch64-tvos-sim). Pin single-sourced from rust-toolchain.toml
        # (cargo --version resolves it via rustup).
        run: |
          cargo --version
          PINNED_TOOLCHAIN="$(grep -E '^channel[[:space:]]*=' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          test -n "$PINNED_TOOLCHAIN" || { echo "could not parse pinned toolchain channel from rust-toolchain.toml"; exit 1; }
          rustup target add --toolchain "$PINNED_TOOLCHAIN" aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-tvos aarch64-apple-tvos-sim

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: example

      - name: Install example dependencies
        # example/pnpm-lock.yaml is gitignored; CI must not freeze.
        run: pnpm --dir example install --no-frozen-lockfile

      - name: Install CocoaPods
        working-directory: example/ios
        # Source checkout without CI-staged prebuilts: explicit source mode
        # (PR210-19). ios/RustCore is prepared BEFORE pod install by the
        # canonical builder (CocoaPods never runs prepare_command for :path
        # pods); the pod phase then rejects a stale staging.
        env:
          UBM_NATIVE_BUILD: source
        run: |
          set -euo pipefail
          pnpm --dir "$GITHUB_WORKSPACE" native:apple:prepare
          BUNDLE_GEMFILE="$GITHUB_WORKSPACE/example/Gemfile" bundle exec pod install

      # Executes host C++ protocol tests plus the Swift CoreBluetooth parser harness.
      # It does not boot a simulator or establish a physical BLE radio/peripheral session.
      - name: Execute Apple Native Protocol executable harness (L2 host; no physical BLE radio)
        run: pnpm test:native-protocol:apple

      - name: Build BlePlxExample (iphonesimulator, New Arch)
        working-directory: example/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace BlePlxExample.xcworkspace \
            -scheme BlePlxExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

  ios-expo:
    name: iOS Expo CNG example
    runs-on: macos-26
    timeout-minutes: 75
    env:
      RCT_NEW_ARCH_ENABLED: '1'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Setup JS package
        uses: ./.github/actions/setup-js-package

      - name: Install pinned Rust + Apple targets
        # Source mode builds ios/RustCore/RustCore.xcframework with the
        # explicit `native:apple:prepare` step (ios/build-rust-core.sh)
        # before pod install; it needs the pinned toolchain plus the Apple device/simulator matrix
        # (aarch64-ios, aarch64-sim, x86_64-sim, aarch64-tvos,
        # aarch64-tvos-sim). Pin single-sourced from rust-toolchain.toml
        # (cargo --version resolves it via rustup).
        run: |
          cargo --version
          PINNED_TOOLCHAIN="$(grep -E '^channel[[:space:]]*=' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          test -n "$PINNED_TOOLCHAIN" || { echo "could not parse pinned toolchain channel from rust-toolchain.toml"; exit 1; }
          rustup target add --toolchain "$PINNED_TOOLCHAIN" aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-tvos aarch64-apple-tvos-sim

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: example

      - name: Prepare RustCore from source (before the example copies the package)
        # example-expo depends on `file:..`: pnpm copies the package files at
        # install time and Expo autolinking compiles the pod from that copy,
        # so ios/RustCore must be staged BEFORE the install (PR210-19 explicit
        # source mode; CocoaPods never runs prepare_command for :path pods).
        env:
          UBM_NATIVE_BUILD: source
        run: pnpm native:apple:prepare

      - name: Install Expo example dependencies
        run: pnpm --dir example-expo install --no-frozen-lockfile

      - name: Align Expo peer deps to installed SDK
        working-directory: example-expo
        run: npx expo install --fix

      - name: Prebuild Expo native projects
        working-directory: example-expo
        run: NODE_ENV=development npx expo prebuild --clean --no-install --platform ios

      - name: Install CocoaPods
        working-directory: example-expo/ios
        # Source checkout without CI-staged prebuilts: explicit source mode
        # (PR210-19). ios/RustCore was prepared before the example install
        # (above), so the package copy the pod compiles carries it; the pod
        # phase then rejects a stale staging.
        env:
          UBM_NATIVE_BUILD: source
        run: BUNDLE_GEMFILE="$GITHUB_WORKSPACE/example/Gemfile" bundle exec pod install

      - name: Build Expo iOS app (iphonesimulator, New Arch)
        working-directory: example-expo/ios
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          if [[ -z "$WORKSPACE" ]]; then
            echo "error: no .xcworkspace after prebuild" >&2
            exit 1
          fi
          # Prefer an app scheme (contains example); skip CocoaPods aggregate schemes.
          SCHEME=$(
            xcodebuild -list -workspace "$WORKSPACE" -json \
              | python3 -c "import json,sys; d=json.load(sys.stdin); s=(d.get('workspace') or d.get('project') or {}).get('schemes') or []; p=[x for x in s if 'example' in x.lower() and 'pod' not in x.lower()]; print((p or s)[0] if s else '')"
          )
          if [[ -z "$SCHEME" ]]; then
            echo "error: could not resolve xcode scheme from $WORKSPACE" >&2
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

  tvos-library:
    name: tvOS library compile check
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Check tvOS library (podspec + vendor Swift)
        run: bash scripts/ci/check-tvos-library.sh
