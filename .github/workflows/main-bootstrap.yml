name: Main migration bootstrap

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package and release-artifact sanity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate evidence records
        run: pnpm validate:evidence

      - name: Run package tests
        run: pnpm test:package

      - name: Run plugin tests
        run: pnpm test:plugin

      - name: Lint and typecheck
        run: pnpm lint

      - name: Build package artifacts
        run: pnpm prepack

      - name: Verify generated release artifacts
        run: pnpm release:artifacts:check

      - name: Verify packed consumer
        run: node scripts/ci/pack-install-smoke.js

      - name: npm package dry run
        run: npm pack --dry-run
