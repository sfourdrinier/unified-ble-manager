            echo "ACTIONS_ID_TOKEN_REQUEST_URL missing — OIDC will not work"
            exit 1
          }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || {
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN missing — OIDC will not work"
            exit 1
          }
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download immutable candidate
        uses: actions/download-artifact@v8
        with:
          name: parallel-draft-candidate
          path: .release-package
      - name: Verify immutable candidate digest
        run: |-
          test "$(cat .release-package/source-commit.txt)" = "$GITHUB_SHA"
          printf "%s  %s\n" "$UBM_PACKED_TARBALL_SHA256" "$UBM_PACKED_TARBALL" | sha256sum --check
