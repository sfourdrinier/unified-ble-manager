        run: |-
          cp "$UBM_PACKED_TARBALL" ".release-package/unified-ble-manager-${GITHUB_REF_NAME#v}.tgz"
          echo "PUBLISH_TARBALL=.release-package/unified-ble-manager-${GITHUB_REF_NAME#v}.tgz" >> "$GITHUB_ENV"
      - name: Classify and guard canonical package release channel
        id: release_channel
        run: node scripts/release/release-version-policy.js
      - name: Check whether versions are already on npm
        id: npm_status
        run: |
          set -euo pipefail
          VER="$(node -p "require('./package.json').version")"
          PACKAGE_PUBLISHED=false
          if npm view "unified-ble-manager@${VER}" version >/dev/null 2>&1; then
            PACKAGE_PUBLISHED=true
            echo "unified-ble-manager@${VER} is already on npm"
          else
            echo "unified-ble-manager@${VER} is not on npm yet"
          fi
          echo "package_published=${PACKAGE_PUBLISHED}" >> "$GITHUB_OUTPUT"
          if [ "$PACKAGE_PUBLISHED" = true ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Canonical package already on npm — will skip publish and continue to GitHub Release"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch main for initial tag verification
        if: steps.npm_status.outputs.package_published != 'true'
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Verify release tag points at current main
        if: steps.npm_status.outputs.package_published != 'true'
        run: |
          set -euo pipefail
          TAG_COMMIT="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          MAIN_COMMIT="$(git rev-parse refs/remotes/origin/main)"
          if [ "${TAG_COMMIT}" != "${MAIN_COMMIT}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} must point exactly at current main before initial publication"
            echo "tag:  ${TAG_COMMIT}"
            echo "main: ${MAIN_COMMIT}"
            exit 1
          fi
      - name: Publish unified-ble-manager (OIDC + provenance)
        if: steps.npm_status.outputs.package_published != 'true'
        run: npm publish "${PUBLISH_TARBALL}" --provenance --access public --tag "${NPM_DIST_TAG}"
      - name: Bind npm tarball to the generated release artifact
        env:
          ALREADY_PUBLISHED: ${{ steps.npm_status.outputs.package_published }}
        run: |
          set -euo pipefail
          VER="$(node -p "require('./package.json').version")"
          REGISTRY_TARBALL=""
          REGISTRY_TARBALL_COPY="$(mktemp)"
          trap 'rm -f "${REGISTRY_TARBALL_COPY}"' EXIT
          REGISTRY_TARBALL_READY=false
          # npm accepted rc.10 but took longer than ten minutes to expose its
          # 118 MB tarball. Give processing twenty minutes, still bounded.
          TARBALL_MAX_ATTEMPTS=240
          for ATTEMPT in $(seq 1 "${TARBALL_MAX_ATTEMPTS}"); do
            if REGISTRY_TARBALL="$(npm view "unified-ble-manager@${VER}" dist.tarball --json 2>/dev/null | node -e "let body = ''; process.stdin.setEncoding('utf8'); process.stdin.on('data', chunk => { body += chunk }); process.stdin.on('end', () => { const value = JSON.parse(body); if (typeof value !== 'string' || !value.startsWith('https://')) { process.exitCode = 1; return; } process.stdout.write(value) })")" && \
              curl --fail --location --silent --show-error --proto '=https' \
                --output "${REGISTRY_TARBALL_COPY}" \
                "${REGISTRY_TARBALL}" && \
              test -s "${REGISTRY_TARBALL_COPY}"; then
              REGISTRY_TARBALL_READY=true
              break
            fi
            echo "npm registry tarball is not downloadable yet (attempt ${ATTEMPT}/${TARBALL_MAX_ATTEMPTS})"
            sleep 5
          done
          if [ "${REGISTRY_TARBALL_READY}" != true ]; then
            echo "npm registry tarball did not become downloadable within the bounded retry window"
            exit 1
          fi

          # A post-publish rerun must attach and hash the immutable npm bytes,
          # not a newly linked native build that may differ byte-for-byte.
          if [ "${ALREADY_PUBLISHED}" = true ]; then
            cp "${REGISTRY_TARBALL_COPY}" "${PUBLISH_TARBALL}"
            echo "Restored exact published npm tarball for release recovery"
          fi

          LOCAL_TARBALL_SHA256="$(node -e "const crypto = require('crypto'); const fs = require('fs'); process.stdout.write(crypto.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex'))" "${PUBLISH_TARBALL}")"
          REGISTRY_TARBALL_SHA256="$(node -e "const crypto = require('crypto'); const fs = require('fs'); process.stdout.write(crypto.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex'))" "${REGISTRY_TARBALL_COPY}")"
          if [ "${REGISTRY_TARBALL_SHA256}" != "${LOCAL_TARBALL_SHA256}" ]; then
            echo "Registry tarball SHA-256 does not match the exact generated publish tarball"
            exit 1
          fi

          PROVENANCE_VERIFIED=false
          for ATTEMPT in $(seq 1 120); do
            if npm view "unified-ble-manager@${VER}" dist.attestations --json 2>/dev/null | node -e "
              let body = '';
              process.stdin.setEncoding('utf8');
              process.stdin.on('data', chunk => { body += chunk });
              process.stdin.on('end', () => {
                const value = JSON.parse(body);
                if (typeof value?.url !== 'string' || !value.url.startsWith('https://registry.npmjs.org/')) {
                  throw new Error('npm attestation URL must use the npm registry HTTPS origin');
                }
                if (value?.provenance?.predicateType !== 'https://slsa.dev/provenance/v1') {
                  throw new Error('npm provenance predicate must be SLSA provenance v1');
                }
              });
            "; then
              PROVENANCE_VERIFIED=true
              break
            fi
            echo "npm provenance metadata is not visible yet (attempt ${ATTEMPT}/120)"
            sleep 5
          done
          if [ "${PROVENANCE_VERIFIED}" != true ]; then
            echo "npm provenance metadata did not become visible within the bounded retry window"
            exit 1
          fi

          {
            printf '%s  %s\n' "${LOCAL_TARBALL_SHA256}" "${PUBLISH_TARBALL}"
            shasum -a 256 SBOM.cdx.json THIRD_PARTY_LICENSES.json
          } > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
      - name: Bind npm provenance to this exact tag commit
        run: |
          set -euo pipefail
          VER="$(node -p "require('./package.json').version")"
          ATTESTATIONS_FILE="$(mktemp)"
          trap 'rm -f "${ATTESTATIONS_FILE}"' EXIT
          ATTESTATIONS_READY=false
          for ATTEMPT in $(seq 1 120); do
            if ATTESTATIONS_URL="$(npm view "unified-ble-manager@${VER}" dist.attestations.url --json 2>/dev/null | node -e "let body = ''; process.stdin.setEncoding('utf8'); process.stdin.on('data', chunk => { body += chunk }); process.stdin.on('end', () => { const value = JSON.parse(body); if (typeof value !== 'string' || !value.startsWith('https://registry.npmjs.org/')) throw new Error('npm attestation URL must use the npm registry HTTPS origin'); process.stdout.write(value) })")" && \
              curl --fail --location --silent --show-error --proto '=https' \
                --output "${ATTESTATIONS_FILE}" \
                "${ATTESTATIONS_URL}" && \
              test -s "${ATTESTATIONS_FILE}"; then
              ATTESTATIONS_READY=true
              break
            fi
            echo "npm provenance attestations are not visible yet (attempt ${ATTEMPT}/120)"
            sleep 5
          done
          if [ "${ATTESTATIONS_READY}" != true ]; then
            echo "npm provenance attestations did not become visible within the bounded retry window"
            exit 1
          fi
          node scripts/ci/verify-npm-provenance-source.js \
            "${ATTESTATIONS_FILE}" \
            "${GITHUB_SHA}" \
            "${GITHUB_REF_NAME}" \
            "https://github.com/sfourdrinier/unified-ble-manager"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists — skipping"
            exit 0
          fi

          NOTES_FILE="$(mktemp)"
          {
            echo "## ${TAG}"
            echo
            BODY="$(awk -v ver="${VER}" '
              $0 ~ ("^## \\[" ver "\\]") { p = 1; next }
              p && $0 ~ /^## \[/ { exit }
              p { print }
            ' CHANGELOG.md)"
            # GitHub release bodies are capped at 125,000 characters. Keep
            # the summary bounded and link the complete tagged changelog.
            BODY="${BODY:0:20000}"
            if [ -n "${BODY}" ]; then
              printf '%s\n' "${BODY}"
            else
              echo "See CHANGELOG.md for ${TAG} details."
            fi
            echo
            echo "Full changelog: https://github.com/sfourdrinier/unified-ble-manager/blob/${TAG}/CHANGELOG.md"
            echo
            echo "### npm package (published with provenance)"
            echo
            echo "- \`unified-ble-manager@${VER}\` — canonical product"
            echo "  - tarball: https://registry.npmjs.org/unified-ble-manager/-/unified-ble-manager-${VER}.tgz"
          } > "${NOTES_FILE}"

          if [[ "${VER}" == *-* ]]; then
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file "${NOTES_FILE}" \
              "${PUBLISH_TARBALL}" \
              SBOM.cdx.json \
              THIRD_PARTY_LICENSES.json \
              SHA256SUMS \
              --prerelease \
              --verify-tag
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file "${NOTES_FILE}" \
              "${PUBLISH_TARBALL}" \
              SBOM.cdx.json \
              THIRD_PARTY_LICENSES.json \
              SHA256SUMS \
              --verify-tag
          fi

          echo "Created GitHub Release ${TAG}"
          rm -f "${NOTES_FILE}"
    if: ${{ success() && needs.results.result == 'success' }}
