name: Validate 4.0.0 release candidate

on:
  push:
    branches:
      - agent/release-4.0.0-docs

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: agent/release-4.0.0-docs
          fetch-depth: 0

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Prepare stable metadata and release guards
        run: |
          rm -f .release-package-test.log .release-package-test-failure.txt
          python3 scripts/release/finalize-4.0.py
          python3 scripts/release/finalize-4.0-tests.py

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Regenerate version-bound docs and dependency artifacts
        run: |
          pnpm docs:backend-sdk
          pnpm release:artifacts

      - name: Validate retained evidence
        run: pnpm validate:evidence

      - name: Run package test suite
        id: package_tests
        shell: bash
        run: |
          set +e
          pnpm test:package 2>&1 | tee .release-package-test.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            tail -n 1200 .release-package-test.log > .release-package-test-failure.txt
          fi
          exit "$STATUS"

      - name: Persist package test diagnostics
        if: failure() && steps.package_tests.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .release-package-test-failure.txt
          git commit -m 'chore: capture 4.0.0 package test failure'
          git push origin HEAD:agent/release-4.0.0-docs

      - name: Run plugin test suite
        run: pnpm test:plugin

      - name: Lint and typecheck
        run: pnpm lint

      - name: Check generated documentation
        run: pnpm docs:check

      - name: Check reproducible release artifacts
        run: pnpm release:artifacts:check

      - name: Run packed-consumer smoke
        run: node scripts/ci/pack-install-smoke.js

      - name: Inspect npm package allowlist
        run: npm pack --dry-run

      - name: Commit finalized candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/release-finalize.yml .github/workflows/release-finalize-v2.yml scripts/release/finalize-4.0.py scripts/release/finalize-4.0-tests.py scripts/release/.finalize-trigger .release-package-test.log .release-package-test-failure.txt
          git diff --cached --check
          git commit -m 'release: prepare unified-ble-manager 4.0.0'
          git push origin HEAD:agent/release-4.0.0-docs
