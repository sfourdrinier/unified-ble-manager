name: Validate 4.0.0 release candidate

on:
  push:
    branches:
      - agent/release-4.0.0-docs

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: agent/release-4.0.0-docs
          fetch-depth: 0

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Prepare stable metadata and release guards
        run: python3 scripts/release/finalize-4.0.py

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Regenerate version-bound docs and dependency artifacts
        run: |
          pnpm docs:backend-sdk
          pnpm release:artifacts

      - name: Validate retained evidence
        run: pnpm validate:evidence

      - name: Run package test suite
        run: pnpm test:package

      - name: Run plugin test suite
        run: pnpm test:plugin

      - name: Lint and typecheck
        run: pnpm lint

      - name: Check generated documentation
        run: pnpm docs:check

      - name: Check reproducible release artifacts
        run: pnpm release:artifacts:check

      - name: Run packed-consumer smoke
        run: node scripts/ci/pack-install-smoke.js

      - name: Inspect npm package allowlist
        run: npm pack --dry-run

      - name: Commit finalized candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/release-finalize.yml .github/workflows/release-finalize-v2.yml scripts/release/finalize-4.0.py scripts/release/.finalize-trigger
          git diff --cached --check
          git commit -m 'release: prepare unified-ble-manager 4.0.0'
          git push origin HEAD:agent/release-4.0.0-docs
