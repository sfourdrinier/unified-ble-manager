# GENERATED by scripts/ci/generate-parallel-publisher-draft.js; do not edit.
# Production publish.yml is preserved and remains the only publisher.
name: Parallel publisher draft (NO PUBLICATION)
on:
  workflow_dispatch:
    inputs:
      cold_cache:
        description: Disable dependency caches for the baseline comparison
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: parallel-publisher-draft-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  native-prebuild-plan:
    name: Plan native Node-API prebuilds
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7.0.0
      - name: Emit maintained prebuild matrix
        id: matrix
        shell: bash
        run: echo "matrix=$(node scripts/native-prebuilds/print-github-matrix.js)" >> "$GITHUB_OUTPUT"
  native-prebuild:
    name: Native prebuild (${{ matrix.backend }} ${{ matrix.platform }}-${{ matrix.arch }})
    timeout-minutes: 90
    needs: native-prebuild-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-prebuild-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7.0.0
      - name: Optional dependency-download cache (never shipping binaries)
        if: ${{ !inputs.cold_cache }}
        uses: actions/cache@v6
        with:
          path: |-
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
            ~/.npm
            ~/.local/share/pnpm/store
            ~/Library/pnpm/store
          key: draft-downloads-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock', 'rust-toolchain.toml', '**/gradle-wrapper.properties', '**/build.gradle') }}-${{ matrix.rustTarget }}
      - name: Install Linux native and Electron smoke dependencies
        if: matrix.builder == 'cargo' && runner.os == 'Linux'
        run: bash scripts/ci/install-linux-native-system-dependencies.sh desktop-prebuild
      - name: Install pinned Rust + target (desktop-core)
        if: matrix.builder == 'cargo'
        shell: bash
        run: |
          set -euo pipefail
          PINNED_TOOLCHAIN="$(grep -E '^channel[[:space:]]*=' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          test -n "$PINNED_TOOLCHAIN" || { echo "could not parse pinned toolchain channel from rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$PINNED_TOOLCHAIN" --profile minimal --target "${{ matrix.rustTarget }}"
      - name: Setup JS package
        uses: ./.github/actions/setup-js-package
        with:
          prepack: "false"
          node-version: "24"
      - name: Build and load maintained Node-API prebuild
        shell: bash
        run: pnpm native-prebuild:build -- --backend "${{ matrix.backend }}"
      - name: Build public package artifacts for Electron prebuild smoke
        run: pnpm prepack
      - name: Load the same prebuild under Electron main
        shell: bash
        env:
          UBM_SMOKE_BACKEND: ${{ matrix.backend }}
        run: bash scripts/ci/run-electron-main-smoke.sh
      - name: Upload path-preserving native prebuild
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifactName }}
          path: .native-prebuild-artifact
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  native-rustcore:
    name: Native RustCore XCFramework (macOS)
    timeout-minutes: 90
    runs-on: macos-26
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7.0.0
      - name: Optional dependency-download cache (never shipping binaries)
        if: ${{ !inputs.cold_cache }}
