      - name: Install pinned Rust + Apple targets
        uses: ./.github/actions/setup-apple-rust
      - name: Build RustCore XCFramework from source
        run: sh ios/build-rust-core.sh
      - name: Verify RustCore staging (slice set + hash chain + sources)
        run: |
