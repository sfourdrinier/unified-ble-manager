          key: draft-downloads-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock', 'rust-toolchain.toml', '**/gradle-wrapper.properties', '**/build.gradle') }}
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Assemble native prebuild matrix
        uses: actions/download-artifact@v8
        with:
          pattern: native-prebuild-*
          path: .
          merge-multiple: true
      - name: Verify and bind complete native prebuild matrix
        run: pnpm native-prebuild:verify --require-all --write-manifest
      - name: Stage CI-built RustCore XCFramework
        uses: actions/download-artifact@v8
        with:
          name: rustcore-xcframework
          path: ios/RustCore
      - name: Verify staged RustCore before pack
        run: node scripts/release/native-build-identity.js --check-apple
      - name: Verify committed Android prebuilts match the sources
        run: node scripts/release/native-build-identity.js --check-android-prebuilts
      - name: Verify every native artifact matches the sources
        run: pnpm native:status
      - name: Install pinned Rust
        run: cargo --version
      - name: Warm cargo cache for offline metadata
        run: cargo fetch --locked
      - name: Build package artifacts
        run: pnpm prepack
      - name: Generate the exact canonical npm publish tarball
        run: |
          set -euo pipefail
          rm -rf .release-package
          mkdir .release-package
          PACK_OUTPUT="$(npm pack --pack-destination .release-package)"
          TARBALL_NAME="$(printf '%s' "${PACK_OUTPUT}" | node -e '
            const fs = require("fs")
            const lines = fs.readFileSync(0, "utf8").split(/\r?\n/).map(line => line.trim()).filter(Boolean)
            if (lines.length === 0) {
              throw new Error("npm pack did not report a tarball filename")
            }
            process.stdout.write(lines[lines.length - 1])
          ')"
          EXPECTED_TARBALL="$(node -p "require('./package.json').name + '-' + require('./package.json').version + '.tgz'")"
          test "${TARBALL_NAME}" = "${EXPECTED_TARBALL}"
          shopt -s nullglob
          TARBALLS=(.release-package/*.tgz)
          test "${#TARBALLS[@]}" -eq 1
          test "${TARBALLS[0]}" = ".release-package/${EXPECTED_TARBALL}"
          PUBLISH_TARBALL=".release-package/${TARBALL_NAME}"
          test -f "${PUBLISH_TARBALL}"
          echo "PUBLISH_TARBALL=${PUBLISH_TARBALL}" >> "$GITHUB_ENV"
      - name: Desktop-core prebuild packaging proof (maintained targets + sidecars)
        run: node scripts/ci/check-napi-artifact-packaging.js --tarball "${PUBLISH_TARBALL}" --require-all-prebuilds
      - name: Seal candidate source and digest
        id: seal
        run: |-
          cp "$PUBLISH_TARBALL" .release-package/canonical.tgz
          sha256sum .release-package/canonical.tgz | cut -d " " -f 1 | while read -r digest; do echo "sha256=$digest" >> "$GITHUB_OUTPUT"; done
          printf "%s\n" "$GITHUB_SHA" > .release-package/source-commit.txt
      - name: Upload immutable candidate
        uses: actions/upload-artifact@v7
        with:
          name: parallel-draft-candidate
          path: |-
            .release-package/canonical.tgz
            .release-package/source-commit.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
    needs:
      - native-prebuild
      - native-rustcore
    outputs:
      sha256: ${{ steps.seal.outputs.sha256 }}
