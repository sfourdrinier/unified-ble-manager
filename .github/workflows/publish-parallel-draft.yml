      UBM_PACKED_TARBALL_SHA256: ${{ needs.canonical-package.outputs.sha256 }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Optional dependency-download cache (never shipping binaries)
        if: ${{ !inputs.cold_cache }}
        uses: actions/cache@v6
        with:
          path: |-
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
            ~/.npm
            ~/.local/share/pnpm/store
            ~/Library/pnpm/store
          key: draft-downloads-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'Cargo.lock', 'rust-toolchain.toml', '**/gradle-wrapper.properties', '**/build.gradle') }}
      - name: Setup JS package
        uses: ./.github/actions/setup-js-package
        with:
          prepack: "false"
          node-version: "24"
      - name: Download immutable candidate
        uses: actions/download-artifact@v8
        with:
          name: parallel-draft-candidate
          path: .release-package
      - name: Verify immutable candidate digest
        run: |-
          test "$(cat .release-package/source-commit.txt)" = "$GITHUB_SHA"
          printf "%s  %s\n" "$UBM_PACKED_TARBALL_SHA256" "$UBM_PACKED_TARBALL" | sha256sum --check
          echo "PUBLISH_TARBALL=.release-package/canonical.tgz" >> "$GITHUB_ENV"
          # Stage generated artifacts only; do not overwrite checked-out sources.
          tar -xzf "$UBM_PACKED_TARBALL" --strip-components=1 package/lib package/ios/RustCore package/native/desktop-core/prebuilds
      - name: Packed Expo/Tauri consumer proof
        run: node scripts/ci/packed-host-consumer-check.js
      - name: Record passing source and artifact receipt
        run: printf "source=%s\ntarball_sha256=%s\njob=%s\n" "$GITHUB_SHA" "$UBM_PACKED_TARBALL_SHA256" "$GITHUB_JOB" >> "$GITHUB_STEP_SUMMARY"
