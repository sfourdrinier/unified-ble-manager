  results:
    name: Draft gate aggregate (cannot publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ always() }}
    needs:
      - native-prebuild-plan
      - native-prebuild
      - native-rustcore
      - android-classic
      - android-expo
      - canonical-package
      - source-gates
      - packed-tauri
      - packed-smoke
      - packed-hosts
      - packed-g6a
      - packed-tv
      - packed-desktop
    steps:
      - name: Require every lane, report failures and candidate identity
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SOURCE_SHA: ${{ github.sha }}
        run: |-
          node <<'NODE'
          const fs = require('node:fs');
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const rows = Object.entries(needs).map(([name, job]) => `${name}: ${job.result}`);
          const digest = needs['canonical-package'].outputs.sha256 || '(candidate unavailable)';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Source: ${process.env.SOURCE_SHA}\nTarball SHA-256: ${digest}\n\n${rows.join('\n')}\n\nDry-run only: no npm publication, release creation, current-main admission or registry/provenance verification.\n`);
          if (Object.values(needs).some(job => job.result !== 'success')) process.exitCode = 1;
          NODE
