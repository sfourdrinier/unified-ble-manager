[package]
edition = "2024"
name = "btleplug"
version = "0.12.0"
authors = ["Nonpolynomial, LLC <kyle@nonpolynomial.com>"]
build = "build.rs"
links = "btleplug_ubm"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
A Cross-Platform Rust Bluetooth Low Energy (BLE) GATT
library.
"""
homepage = "https://github.com/deviceplug/btleplug"
readme = "README.md"
keywords = [
    "bluetooth",
    "BLE",
    "bluez",
    "uwp",
    "corebluetooth",
]
categories = ["hardware-support"]
license = "MIT/Apache-2.0/BSD-3-Clause"
repository = "https://github.com/deviceplug/btleplug"

[features]
jni-host-tests = [
    "jni/invocation",
    "once_cell",
]
serde = [
    "uuid/serde",
    "serde_cr",
    "serde_bytes",
]

[lib]
name = "btleplug"
path = "src/lib.rs"


































[dependencies.async-trait]
version = "0.1.89"

[dependencies.bitflags]
version = "2.11.0"

[dependencies.dashmap]
version = "6.1.0"

[dependencies.futures]
version = "0.3.32"

[dependencies.log]
version = "0.4.29"

[dependencies.serde_bytes]
