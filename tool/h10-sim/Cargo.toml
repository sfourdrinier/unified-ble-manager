[workspace]

[package]
name = "h10-sim"
version = "0.1.0"
edition = "2021"
description = "Polar H10 BLE peripheral simulator for unified-ble-manager driver scenarios (test tool, not part of the published package)"
license = "MIT"

[[bin]]
name = "h10-sim"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

# Linux drives the radio with bluer directly (full LEAdvertisement1 control,
# GATT application registered before the advertisement); macOS/Windows keep
# the ble-peripheral-rust backend. bluer needs libdbus-1-dev at build time on
# Linux (it already did transitively through ble-peripheral-rust).
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "=0.17.4", features = ["bluetoothd"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ble-peripheral-rust = "=0.2.0"

[dev-dependencies]
