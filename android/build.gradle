// android/build.gradle

buildscript {
  ext.kotlin_version = "1.9.24"
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.8.0"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

apply plugin: "com.android.library"
apply plugin: "com.facebook.react"
apply plugin: "org.jetbrains.kotlin.android"

def appProject = rootProject.allprojects.find { it.plugins.hasPlugin('com.android.application') }

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["BlePlx_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["BlePlx_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  if (major == 7 && minor >= 3) {
    return true
  }

  return major >= 8
}

android {
  ndkVersion rootProject.ext.has("ndkVersion") ? rootProject.ext.ndkVersion : "27.1.12297006"

  if (supportsNamespace()) {
    namespace = "com.sfourdrinier.unifiedblemanager"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdk getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdk getExtOrIntegerDefault("minSdkVersion")
    targetSdk getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "true"
    buildConfigField "String", "OWNED_RADIO_ID", "\"owned-android-gatt-v1\""
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared"
        cppFlags "-std=c++20"
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled false
    }
  }

  buildFeatures {
    prefab = true
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
  externalNativeBuild {
    cmake {
      path file("src/main/jni/CMakeLists.txt")
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.mockito:mockito-core:5.14.2"
}

react {
  jsRootDir = file("../src/")
  libraryName = "BlePlx"
  codegenJavaPackageName = "com.sfourdrinier.unifiedblemanager"
}

// HOST-ANDROID (UBM 5.0, trackourhealth/bun-mono#1188): the Rust cdylib
// (bindings/jni, `libubm5_jni_echo.so`) for the app ABI list, staged
// per-variant so the GATT bridge natives resolve at runtime.
//
// ABI list (recorded): arm64-v8a (physical devices — the ABI the apps
// ship) plus x86_64 (KVM host-matched emulator ABI,
// system-images;android-34;google_apis;x86_64). armeabi-v7a stays a
// documented boundary (no 32-bit ARM device on this lane), not a failure.
// Toolchain is pinned (1.98.1) and targets are explicit rustc targets inside
// android/build-rust-cdylib.sh (single source of truth, shared with the
// five0 probe-app build); no cargo-ndk required.
//
// Two contexts, one loader (F01):
//   * Dev checkout (Rust sources AND ../.git present): build from source
//     per profile/ABI exactly as below (F20 semantics preserved).
//   * Packed consumer (Expo CNG, node_modules — no ../.git): the npm
//     artifact ships COMMITTED release prebuilts under src/main/jniLibs
//     plus build-identity.txt. The tasks VERIFY them (presence, bytes,
//     sha256 vs the identity file) and the variants package them — the
//     bridge natives LOAD in packed consumers, never skip. A packed tree
//     without prebuilts fails LOUD (broken artifact), never silently.
//
// F20: one task per profile (no task-name sniffing — a joint
// `assembleDebug assembleRelease` builds each profile for its own
// variant), the COMPLETE Rust input graph declared, and ABI/profile
// outputs isolated under build/ (never a shared tree). Source builds
// package ONLY their own profile's staging via per-variant jniLibs
// srcDirs; packed builds package the committed src/main/jniLibs tree.
def ubmRustAbis = ["arm64-v8a", "x86_64"]
def ubmRustScript = file("build-rust-cdylib.sh")
// projectDir-relative: rootDir is example/android when the library is
// included as a module, so repo-root paths must go through ../.
def ubmRustSrcDir = projectDir.toPath().resolve("../bindings/jni/src").toFile()
def ubmRustManifest = projectDir.toPath().resolve("../bindings/jni/Cargo.toml").toFile()
def ubmRustSourcesPresent = ubmRustSrcDir.isDirectory() && ubmRustManifest.isFile()
// The npm artifact ships sources (for cargo path-deps) AND prebuilts; only
// a development checkout carries .git, so .git — not source presence —
// selects source builds. Packed consumers must never need NDK/Rust.
def ubmRustDevCheckout = ubmRustSourcesPresent && projectDir.toPath().resolve("../.git").toFile().exists()
def ubmRustPrebuiltDir = file("src/main/jniLibs")
def ubmRustPrebuiltIdentity = new File(ubmRustPrebuiltDir, "build-identity.txt")
// Complete Rust input graph (F20): the cdylib crate plus its transitive
// path dependencies, exactly as pinned in bindings/jni/Cargo.toml
// [dependencies] (ubm-core, ubm-fake-radio; ubm-fake-radio itself
// path-depends on ubm-core), the workspace manifest + lockfile, and the
// toolchain pin. A core edit, a lock change, or a toolchain change all
// invalidate the staged .so. Keep this list in sync with the manifest's
// path-deps when they change.
def ubmRustInputDirs = [
  ubmRustSrcDir,
  projectDir.toPath().resolve("../crates/ubm-core/src").toFile(),
  projectDir.toPath().resolve("../crates/ubm-fake-radio/src").toFile(),
]
def ubmRustInputFiles = [
  ubmRustManifest,
  projectDir.toPath().resolve("../crates/ubm-core/Cargo.toml").toFile(),
  projectDir.toPath().resolve("../crates/ubm-fake-radio/Cargo.toml").toFile(),
  projectDir.toPath().resolve("../Cargo.toml").toFile(),
  projectDir.toPath().resolve("../Cargo.lock").toFile(),
  projectDir.toPath().resolve("../rust-toolchain.toml").toFile(),
]

["debug", "release"].each { ubmRustProfile ->
  def taskName = "buildUbmRustCdylib${ubmRustProfile.capitalize()}"
  def stagingDir = file("${buildDir}/ubmRustCdylib/${ubmRustProfile}")
  tasks.register(taskName) {
    description = "UBM 5.0 Rust cdylib (${ubmRustProfile}) for ${ubmRustAbis}: builds from source in a dev checkout, verifies committed prebuilts in a packed consumer."
    inputs.property("ubmRustProfile", ubmRustProfile)
    inputs.property("ubmRustAbis", ubmRustAbis)
    inputs.property("ubmRustDevCheckout", ubmRustDevCheckout)
    inputs.file(ubmRustScript)
    if (ubmRustDevCheckout) {
      ubmRustInputDirs.each { dir ->
        if (dir.isDirectory()) {
          inputs.dir(dir)
        }
      }
      ubmRustInputFiles.each { manifest ->
        if (manifest.isFile()) {
          inputs.file(manifest)
        }
      }
    } else if (ubmRustPrebuiltDir.isDirectory()) {
      inputs.dir(ubmRustPrebuiltDir)
    }
    outputs.dir(stagingDir)
    doLast {
      if (!ubmRustDevCheckout) {
        verifyUbmRustPrebuilts(taskName, stagingDir)
        return
      }
      def identity = new StringBuilder()
      identity.append("profile=${ubmRustProfile}\n")
      identity.append("abis=${ubmRustAbis.join(',')}\n")
      ubmRustAbis.each { abi ->
        def libDir = new File(stagingDir, abi)
        def result = providers.exec {
          commandLine("sh", ubmRustScript.absolutePath,
            "--abi", abi,
            "--profile", ubmRustProfile,
            "--libdir", libDir.absolutePath)
          workingDir(rootDir)
        }.result.get()
        if (result.exitValue != 0) {
          throw new GradleException(
            "${taskName} FAILED for ABI ${abi} (exit ${result.exitValue}). " +
            "Run sh ${ubmRustScript} --abi ${abi} --profile ${ubmRustProfile} " +
            "--libdir <dir> from the repo root for the actionable diagnostic " +
            "(NDK 27.x, pinned Rust from rust-toolchain.toml + aarch64-linux-android and x86_64-linux-android targets).")
        }
        def staged = new File(libDir, "libubm5_jni_echo.so")
        if (!staged.isFile()) {
          throw new GradleException(
            "${taskName} FAILED: staged cdylib missing at ${staged} " +
            "despite exit 0 — re-run the script by hand for diagnostics.")
        }
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        staged.eachByte(65536) { buf, len -> digest.update(buf, 0, len) }
        identity.append("abi=${abi} sha256=${digest.digest().encodeHex().toString()} " +
          "bytes=${staged.length()} file=libubm5_jni_echo.so\n")
      }
      new File(stagingDir, "build-identity.txt").text = identity.toString()
      logger.lifecycle("${taskName} staged ${stagingDir}:\n${identity}")
    }
  }
}

// Packed-consumer path (F01): verify the committed release prebuilts the
// npm artifact ships — presence, non-empty bytes, and sha256 against
// build-identity.txt — then record the receipt under the variant staging
// dir. The variants package src/main/jniLibs itself (see below), so this
// copies nothing: a second copy of the same SONAME would collide at merge.
// Missing or mismatched prebuilts fail LOUD: a packed tree without a
// loadable Rust library is a broken artifact, never a silent skip.
// A closure (not a `def` method) so the script-local prebuilt paths above
// stay visible: Gradle script methods cannot capture script locals.
def verifyUbmRustPrebuilts = { String taskName, File stagingDir ->
  if (!ubmRustPrebuiltIdentity.isFile()) {
    throw new GradleException(
      "${taskName} FAILED: packed-consumer context (no ../.git) but no committed prebuilts at ${ubmRustPrebuiltDir} " +
      "(build-identity.txt missing). The npm artifact must ship src/main/jniLibs/<abi>/libubm5_jni_echo.so for ${ubmRustAbis}.")
  }
  def expected = [:]
  ubmRustPrebuiltIdentity.eachLine { line ->
    def matcher = line =~ /^abi=(\S+) sha256=([0-9a-f]{64}) bytes=(\d+) file=(\S+)$/
    if (matcher.matches()) {
      expected[matcher.group(1)] = [sha256: matcher.group(2), bytes: matcher.group(3).toLong(), file: matcher.group(4)]
    }
  }
  def receipt = new StringBuilder()
  receipt.append("context=packed-prebuilt\n")
  ubmRustAbis.each { abi ->
    def want = expected[abi]
    if (want == null) {
      throw new GradleException(
        "${taskName} FAILED: build-identity.txt has no entry for ABI ${abi} (expected one abi= line per ABI in ${ubmRustAbis}).")
    }
    def prebuilt = new File(new File(ubmRustPrebuiltDir, abi), want.file)
    if (!prebuilt.isFile() || prebuilt.length() == 0) {
      throw new GradleException(
        "${taskName} FAILED: committed prebuilt missing or empty at ${prebuilt} for ABI ${abi}.")
    }
    if (prebuilt.length() != want.bytes) {
      throw new GradleException(
        "${taskName} FAILED: prebuilt ${prebuilt} is ${prebuilt.length()} bytes, identity says ${want.bytes} — stale or tampered prebuilt.")
    }
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    prebuilt.eachByte(65536) { buf, len -> digest.update(buf, 0, len) }
    def actual = digest.digest().encodeHex().toString()
    if (actual != want.sha256) {
      throw new GradleException(
        "${taskName} FAILED: prebuilt ${prebuilt} sha256 ${actual} does not match build-identity.txt (${want.sha256}).")
    }
    receipt.append("abi=${abi} sha256=${actual} bytes=${prebuilt.length()} file=${want.file}\n")
  }
  stagingDir.mkdirs()
  new File(stagingDir, "packed-prebuilt-receipt.txt").text = receipt.toString()
  logger.lifecycle("${taskName} verified packed prebuilts at ${ubmRustPrebuiltDir}:\n${receipt}")
}

// Back-compat lifecycle task: builds (dev) or verifies (packed) both profiles.
tasks.register("buildUbmRustCdylib") {
  description = "UBM 5.0 Rust cdylib (debug + release): source builds in a dev checkout, prebuilt verification in a packed consumer."
  dependsOn("buildUbmRustCdylibDebug", "buildUbmRustCdylibRelease")
}

// Per-variant wiring (F20): each variant builds (and packages) only its
// own profile — no sniffing, no shared outputs. AGP registers the
// per-variant lifecycle tasks in its own afterEvaluate (which runs before
// this one), so the wiring resolves here and fails loudly if absent.
afterEvaluate {
  tasks.named("preDebugBuild") { dependsOn("buildUbmRustCdylibDebug") }
  tasks.named("preReleaseBuild") { dependsOn("buildUbmRustCdylibRelease") }
}
if (ubmRustDevCheckout) {
  android.sourceSets.debug.jniLibs.srcDirs += file("${buildDir}/ubmRustCdylib/debug")
  android.sourceSets.release.jniLibs.srcDirs += file("${buildDir}/ubmRustCdylib/release")
  // Source builds never merge the committed prebuilt tree: each variant
  // packages ONLY its own profile's staging.
  android.sourceSets.main.jniLibs.srcDirs = []
} else {
  // Packed consumers package the committed release prebuilts: the bridge
  // natives load from the AAR, no NDK/Rust required. Verified per-variant
  // by the tasks above; a missing tree fails loud there, never here.
  android.sourceSets.main.jniLibs.srcDirs = [file("src/main/jniLibs")]
}
