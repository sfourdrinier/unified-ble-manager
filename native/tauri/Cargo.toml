[package]
name = "tauri-plugin-unified-ble-manager"
version = "5.0.0-rc.11"
description = "Cross-platform Tauri v2 Bluetooth Low Energy plugin for Unified BLE Manager"
authors = ["Unified BLE Manager contributors"]
license-file = "../../LICENSE-UBM-SOURCE-AVAILABLE-1.0.md"
edition = "2021"
rust-version = "1.98.1"
repository = "https://github.com/sfourdrinier/unified-ble-manager"
links = "tauri-plugin-unified-ble-manager"
include = ["build.rs", "permissions", "src"]

[lib]
crate-type = ["rlib"]

[dependencies]
btleplug = "0.12"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
serde_json = "1"
tauri = { version = "2", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# F01: the plugin schedules BLE ops through the shared desktop authority
# (`ubm-desktop`, itself over `ubm-core`); error and contract identities stay
# single-owned by the shared core and cross verbatim.
ubm-core = { path = "../../crates/ubm-core" }
ubm-desktop = { path = "../../crates/ubm-desktop" }
uuid = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }

[build-dependencies]
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
tauri-plugin = { version = "2", features = ["build"] }

# Vendored btleplug with the UBM patches (vendor/btleplug/UBM_PATCHES.md):
# Tauri must link the same patched copy as the root workspace.
[patch.crates-io]
btleplug = { path = "../../vendor/btleplug" }
bluez-async = { path = "../../vendor/bluez-async" }
