# .coderabbit.yaml
# CodeRabbit configuration for unified-ble-manager.
# Docs: https://docs.coderabbit.ai/getting-started/yaml-configuration
#
# The review rules below are AGENTS.md, restated for a reviewer that has not
# read it. Where the two disagree, AGENTS.md is the source of truth.

language: en-US

reviews:
  high_level_summary: true
  poem: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    # Drafts are skipped deliberately: a release branch is opened as a draft
    # while PRs are still being merged into it, and reviewing that churn wastes
    # everyone's attention.
    drafts: false
  path_filters:
    # Generated by their generators and verified byte-identical by
    # `pnpm docs:check` and `pnpm release:artifacts:check`. Reviewing them
    # produces comments no human should act on - the fix is always to rerun the
    # generator, never to edit the output.
    - "!docs/generated/**"
    - "!etc/api/**"
    - "!SBOM.cdx.json"
    - "!THIRD_PARTY_LICENSES.json"
    - "!pnpm-lock.yaml"
    - "!**/Cargo.lock"

  path_instructions:
    - path: "__tests__/**"
      instructions: |
        A test's verdict must never depend on how fast or busy the machine is;
        only its runtime may. FLAG any wait that races real time: a poll loop
        asking "has it happened yet?", `setInterval`, or
        `Promise.race([work, sleep])` where the sleep can decide the outcome.
        The correct shape is to await the event itself - the test owns the mock
        the signal passes through and resolves a promise there.
        `__tests__/helpers/async.js` is the only file allowed to schedule a
        timer, and only on a failure path; `__tests__/DeterministicWaits.test.js`
        enforces this.

        A single `await new Promise(resolve => setImmediate(resolve))` is fine -
        one turn of the macrotask queue always happens.

        Do NOT ask for JSDoc on fixtures, builders or trivial callbacks. DO flag
        assertions that cannot fail, tests that do not verify what their name
        claims, and missing cleanup that leaks into the next test.

    - path: "src/backends/**"
      instructions: |
        A backend must report its own truth. FLAG a capability declared
        supported that the platform cannot honour, and FLAG a failure reported
        as a different, tidier failure - a cancelled operation that actually
        completed, a timeout reported as a cancellation, an error stringified
        before it is classified. Errors carry structure; classify on that
        structure, never on message text.

    - path: "native/**"
      instructions: |
        Native and private protocols are versioned and fail closed. FLAG a
        version stamped as a literal rather than taken from the generated
        constant, and FLAG a record that can be dropped without the application
        being told - a quarantined record must surface a diagnostic.

  instructions: |
    This library drives real medical peripherals (CGMs, heart-rate straps). A
    defect here presents as "the device is not working", so the expensive bugs
    are the ones that turn a specific fault into silence.

    ALWAYS FLAG:
    - Anything that silently swallows a failure: an empty catch, a dropped
      record, a filtered-out observation, a default substituted for an error.
      This is the highest-value class in this repository - several shipped
      defects were boundaries that discarded evidence.
    - Type escapes: `as any`, `as unknown`, or `as T` used to silence the
      checker. Fix the types, use a guard or a mapper.
    - A hardcoded timing or capacity constant with no comment saying whether it
      is a protocol invariant, a safety bound, or host policy.
    - Ownership and lifetime bugs: unreleased connections, leaked
      subscriptions, immortal device-object state, missing async teardown.
    - Contract violations against 4.x: Base64 in a public value (public values
      are `Uint8Array`), caller-created transaction IDs (cancellation is
      `AbortSignal`), a static `supports()` matrix (capabilities are reported at
      runtime by the instantiated backend), or the host-neutral root choosing or
      falling back to a radio.
    - A deterministic backend or mock reachable from a production path. They are
      test infrastructure, never a radio fallback.
    - Evidence claims that overstate: compile, mock or deterministic-test
      results described as physical-radio proof.
    - Duplication that should be centralized - this codebase is aggressively DRY.
    - Deprecated APIs, libraries or build patterns where a supported alternative
      exists.
    - Hand-edits to generated artifacts (see path_filters) instead of rerunning
      the generator.

    SKIP:
    - JSDoc on self-documenting functions where the name, parameters and return
      type already say everything.
    - Extracting trivial inline callbacks into named functions for their own
      sake.
    - Naming a TypeScript interface for a 1-3 field inline type used once.
    - Cosmetic renames of inherited native or example identifiers (e.g.
      `BlePlxExample`); those are deliberate and out of scope.
